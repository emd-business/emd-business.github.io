<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>متجر الكوكيز بالقصص</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courgette&family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--br:#5a3a2e;--brd:#3f271e;--car:#d99a4e;--cream:#f7f1e8;--paper:#fffaf3;--muted:#8b7769}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d130e}
body{font-family:Cairo,Tahoma,sans-serif;color:#fff}
button{font-family:inherit;cursor:pointer}
.badge{position:fixed;top:30px;left:10px;z-index:70;background:#b91c1c;color:#fff;font-size:10.5px;padding:2px 8px;border-radius:6px}
.feed{height:100svh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.st{position:relative;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;max-width:520px;margin:0 auto}
.st .bg{position:absolute;inset:0;background:center/cover;transform:scale(1.15);transition:transform 7s linear}
.st.on .bg{transform:scale(1)}
.st .bg.blur{filter:blur(22px) brightness(.8) saturate(1.2);transform:scale(1.3)}
.st .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 22%,transparent 45%,rgba(29,19,14,.9))}
.st .orb{position:absolute;left:50%;top:40%;width:62vw;max-width:300px;aspect-ratio:1;border-radius:50%;background:center/cover;transform:translate(-50%,-50%) rotate(-25deg) scale(.7);opacity:0;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 8px rgba(255,250,243,.15);transition:transform 1.1s cubic-bezier(.2,.9,.3,1.2),opacity .6s}
.st.on .orb{transform:translate(-50%,-50%) rotate(0) scale(1);opacity:1}
.st.on .orb{animation:spin 30s linear 1.2s infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
/* أشرطة القصص */
.bars{position:fixed;top:12px;left:12px;right:12px;z-index:50;display:flex;gap:4px;max-width:496px;margin:0 auto}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff;transition:width .3s}
.bars i.done b{width:100%}
.bars i.cur b{width:100%;transition:width 5s linear}
.who{position:fixed;top:24px;right:12px;z-index:50;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.who .av{width:34px;height:34px;border-radius:50%;background:#e9b26a;border:2px solid #fff;display:grid;place-items:center}
.who .av svg{width:26px}
/* بطاقة المنتج */
.info{position:relative;z-index:3;padding:0 18px 30px;opacity:0;transform:translateY(40px);transition:opacity .6s .3s,transform .7s cubic-bezier(.2,.9,.3,1.1) .3s}
.st.on .info{opacity:1;transform:none}
.info .tagx{display:inline-block;background:rgba(255,250,243,.2);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 12px;font-size:12px;margin-bottom:8px}
.info h2{margin:0;font-family:Courgette,cursive;font-weight:400;font-size:40px;line-height:1.1;direction:ltr;text-align:right;text-shadow:0 3px 14px rgba(0,0,0,.45)}
.info .ar{font-size:15px;font-weight:700;opacity:.9}
.info p{margin:6px 0 14px;font-size:15px;opacity:.95}
.row{display:flex;align-items:center;gap:10px}
.price{font-size:26px;font-weight:800;margin-inline-end:auto}
.step{display:flex;align-items:center;gap:10px;background:rgba(255,250,243,.18);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--brd);font-size:18px;font-weight:800}
.step b{min-width:18px;text-align:center;font-size:16px}
.addb{border:0;background:var(--paper);color:var(--brd);font-weight:800;font-size:15px;border-radius:999px;padding:11px 18px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.addb:active{transform:scale(.95)}
.hint2{font-size:12px;opacity:.75;margin-top:10px;text-align:center}
.heart{position:absolute;z-index:6;font-size:90px;pointer-events:none;animation:hrt .9s ease forwards}
@keyframes hrt{0%{transform:translate(-50%,-50%) scale(0);opacity:1}40%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}
/* الشاشة الأولى */
.intro{background:radial-gradient(circle at 50% 35%,#7a4b33,#2b1a12 70%)}
.intro .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.intro .lg{width:130px;height:130px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06) rotate(-5deg)}}
.intro h1{font-family:Courgette,cursive;font-weight:400;font-size:44px;margin:10px 0 0}
.intro .t{opacity:.85;font-size:15px}
.intro .chips{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.intro .chips span{width:48px;height:48px;border-radius:50%;background:center/cover;border:2px solid rgba(255,255,255,.7);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
.swipe{position:absolute;bottom:36px;left:0;right:0;text-align:center;font-size:13px;opacity:.85}
.swipe .ar{display:block;font-size:24px;animation:up 1.4s ease-in-out infinite}
@keyframes up{50%{transform:translateY(-10px)}}
/* الأخيرة */
.end{background:var(--cream);color:var(--br)}
.end .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.end h2{font-family:Courgette,cursive;font-weight:400;font-size:36px;margin:0}
.end .q{background:#fff;border-radius:16px;padding:14px 16px;margin:8px 0;box-shadow:0 10px 20px -12px rgba(63,39,30,.4);font-size:14px;max-width:320px}
.end .q small{display:block;color:var(--muted);margin-top:4px}
.end button{margin-top:16px;border:0;background:var(--br);color:var(--paper);font-weight:800;font-size:16px;border-radius:999px;padding:12px 26px}
/* البرطمان */
.jar{position:fixed;top:64px;left:12px;z-index:55;width:62px;height:76px;border:0;background:none;padding:0}
.jar svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.jar .n{position:absolute;top:-4px;right:-4px;background:var(--car);color:var(--brd);font-weight:800;font-size:12px;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;border:2px solid #fff}
.jar.bump{animation:jb .5s}
@keyframes jb{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.95) rotate(5deg)}}
.flyc{position:fixed;z-index:80;width:70px;height:70px;border-radius:50%;background:center/cover;pointer-events:none;transition:transform .75s cubic-bezier(.5,-0.4,.5,1),opacity .75s;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.sheet{position:fixed;inset:0;z-index:90;background:rgba(29,19,14,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet .bx{width:100%;max-width:520px;background:var(--paper);color:var(--br);border-radius:26px 26px 0 0;padding:18px 16px 26px;max-height:84vh;overflow:auto;animation:sh .35s ease}
@keyframes sh{from{transform:translateY(40%)}}
.sheet h3{margin:0 0 8px;font-size:20px;display:flex;justify-content:space-between}
.ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eadfce;font-size:14px}
.ln .th{width:42px;height:42px;border-radius:50%;background:center/cover;flex:none}
.ln .nm{flex:1}
.pbtn{border:1px solid var(--br);background:#fff;color:var(--br);border-radius:8px;padding:4px 10px;font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:14px 0}
.ok{width:100%;border:0;background:var(--br);color:var(--paper);font-weight:800;font-size:16px;padding:13px;border-radius:14px}
.empty{text-align:center;color:var(--muted);padding:20px 0}
.thanks{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(29,19,14,.85);color:#fff;text-align:center}
.thanks.show{display:grid}
.thanks .big{font-family:Courgette,cursive;font-size:48px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.rain{position:absolute;top:-80px;width:50px;height:50px;border-radius:50%;background:center/cover;animation:rain linear forwards}
@keyframes rain{to{transform:translateY(120vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="badge">معاينة تجريبية</div>
<div class="bars" id="bars"></div>
<div class="who"><div class="av" id="av"></div><span id="whoName">Cookie Bite</span></div>
<button class="jar" id="jar" aria-label="السلة"><svg viewBox="0 0 62 76"><rect x="14" y="2" width="34" height="10" rx="3" fill="#c98b45"/><rect x="10" y="10" width="42" height="6" rx="2" fill="#a86f33"/><path d="M8 18h46q4 0 4 5v42q0 9-9 9H13q-9 0-9-9V23q0-5 4-5z" fill="rgba(255,250,243,.35)" stroke="#fff" stroke-width="2"/><clipPath id="jc"><path d="M8 18h46q4 0 4 5v42q0 9-9 9H13q-9 0-9-9V23q0-5 4-5z"/></clipPath><g clip-path="url(#jc)" id="jarFill"></g><path d="M12 24v38" stroke="#fff" stroke-width="3" opacity=".5" stroke-linecap="round"/></svg><span class="n" id="jn">0</span></button>

<div class="feed" id="feed"></div>

<div class="sheet" id="sheet"><div class="bx"><h3><span>برطمانك</span><button onclick="sheet.classList.remove('show')" style="border:0;background:none;font-size:20px;color:inherit">✕</button></h3><div id="lines"></div><div class="tot"><span>الإجمالي</span><span id="st"></span></div><button class="ok" id="okBtn">تأكيد الطلب</button></div></div>
<div class="thanks" id="thanks"><div><div class="big">thank you!</div><div>شكرًا لطلبك، حبٌّ مخبوز في الطريق إليك</div><small style="opacity:.7">هذه معاينة فقط، لم يُرسل أي طلب</small></div></div>

<script>
const P=[
 {id:'ny',en:'New York cookies',ar:'نيويورك',d:'كلاسيك، الأصل الذي لا يُمل 🍪',p:5,w:'w_ny',i:'i_ny',tag:'الأكثر طلبًا'},
 {id:'lotus',en:'Lotus cookies',ar:'لوتس',d:'قضمة بطعم الكراميل والبسكويت 🧡',p:5,w:'w_lotus',i:'i_lotus',tag:'محشوة'},
 {id:'red',en:'Red velvet cookies',ar:'ريد فيلفت',d:'ناعمة، غنية، لا تُنسى ❤️',p:5,w:'w_red',i:'i_red',tag:'شوكولاتة بيضاء'},
 {id:'mon',en:'Monster cookies',ar:'مونستر',d:'أوريو مرحة مليئة بالمفاجآت 💙',p:6,w:'w_monster',i:null,tag:'جديد'},
 {id:'pis',en:'Pistachio cookies',ar:'بستاشيو',d:'فستق بقلب طري 💚',p:6,w:'w_pist',i:null,tag:'فاخر'}
];
const CUR='₪';let cart={},qty={};P.forEach(x=>qty[x.id]=1);
const MINI=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#e9b26a" stroke="#c98b45" stroke-width="2"/><g fill="#6b3f2a"><circle cx="14" cy="15" r="2.6"/><circle cx="23" cy="20" r="2.6"/><circle cx="15" cy="27" r="2.2"/><circle cx="27" cy="28" r="2"/></g><circle cx="35" cy="7" r="7" fill="#e9b26a"/></svg>`;
av.innerHTML=MINI;

/* بناء القصص */
let h=`<section class="st intro on"><div class="c"><div class="lg">${MINI.replace('fill="#e9b26a"/></svg>','fill="#2b1a12"/></svg>')}</div><h1>Cookie Bite</h1><div class="t">حبٌّ مخبوز في كل قضمة، تُحضَّر طازجة حسب الطلب</div>
 <div class="chips">${P.map((x,k)=>`<span style="background-image:url(cb/${x.w}.jpg);animation-delay:${.3+k*.12}s"></span>`).join('')}</div></div>
 <div class="swipe"><span class="ar">⌃</span>اسحب للأعلى لتتصفح الكوكيز</div></section>`;
h+=P.map(x=>`<section class="st" data-id="${x.id}">
 ${x.i?`<div class="bg" style="background-image:url(cb/${x.i}.jpg)"></div>`:`<div class="bg blur" style="background-image:url(cb/${x.w}.jpg)"></div><div class="orb" style="background-image:url(cb/${x.w}.jpg)"></div>`}
 <div class="shade"></div>
 <div class="info"><span class="tagx">${x.tag}</span><h2>${x.en}</h2><div class="ar">${x.ar}</div><p>${x.d}</p>
  <div class="row"><div class="price">${x.p} ${CUR}</div><div class="step"><button onclick="q('${x.id}',1)">+</button><b id="q${x.id}">1</b><button onclick="q('${x.id}',-1)">−</button></div><button class="addb" onclick="add('${x.id}',this)">أضف للبرطمان</button></div>
  <div class="hint2">أو اضغط الصورة مرتين ❤️</div></div></section>`).join('');
h+=`<section class="st end"><div class="c"><h2>Feedback ✨</h2><div class="q">«ألذ كوكيز جربتها، الريد فيلفت لا يُنسى»<small>زبونة عادت للمرة الثالثة</small></div><div class="q">«التغليف أنيق والكوكيز وصلت طرية»<small>طلب هدية</small></div><button onclick="openJar()">افتح برطمانك 🍪</button></div></section>`;
feed.innerHTML=h;
const S=[...feed.querySelectorAll('.st')];
bars.innerHTML=S.map(()=>'<i><b></b></i>').join('');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6){S.forEach(s=>s.classList.remove('on'));e.target.classList.add('on');const k=S.indexOf(e.target);
 bars.querySelectorAll('i').forEach((b,j)=>{b.className=j<k?'done':j===k?'cur':''})}}),{root:feed,threshold:[.6]});
S.forEach(s=>io.observe(s));

/* ضغطتان = إضافة */
let lastTap=0;feed.addEventListener('click',e=>{const s=e.target.closest('.st[data-id]');if(!s||e.target.closest('button'))return;const now=Date.now();
 if(now-lastTap<320){const hh=document.createElement('div');hh.className='heart';hh.textContent='❤️';hh.style.left=e.clientX+'px';hh.style.top=(e.clientY-s.getBoundingClientRect().top)+'px';s.appendChild(hh);setTimeout(()=>hh.remove(),900);add(s.dataset.id,null,e.clientX,e.clientY)}lastTap=now});

function q(id,d){qty[id]=Math.max(1,qty[id]+d);document.getElementById('q'+id).textContent=qty[id]}
function add(id,btn,x0,y0){const x=P.find(p=>p.id===id),n=qty[id];
 let sx=x0,sy=y0;if(btn){const r=btn.getBoundingClientRect();sx=r.left+r.width/2;sy=r.top}
 const j=jar.getBoundingClientRect(),f=document.createElement('div');f.className='flyc';f.style.backgroundImage=`url(cb/${x.w}.jpg)`;f.style.left=(sx-35)+'px';f.style.top=(sy-35)+'px';document.body.appendChild(f);
 requestAnimationFrame(()=>{f.style.transform=`translate(${j.left+j.width/2-sx}px,${j.top+j.height/2-sy}px) rotate(-400deg) scale(.3)`;f.style.opacity='.6'});
 setTimeout(()=>{f.remove();cart[id]=(cart[id]||0)+n;qty[id]=1;document.getElementById('q'+id).textContent=1;paint();jar.classList.remove('bump');void jar.offsetWidth;jar.classList.add('bump')},750)}
function paint(){let n=0,t=0;for(const k in cart){n+=cart[k];t+=cart[k]*P.find(p=>p.id===k).p}jn.textContent=n;
 let g='';for(let k=0;k<Math.min(n,14);k++){const r=k%4,row=Math.floor(k/4);g+=`<circle cx="${14+r*11+(row%2)*5}" cy="${66-row*10}" r="6" fill="#e2a85c" stroke="#b9803c"/><circle cx="${13+r*11+(row%2)*5}" cy="${65-row*10}" r="1.4" fill="#6b3f2a"/>`}
 jarFill.innerHTML=g;
 lines.innerHTML=n?Object.keys(cart).map(k=>{const x=P.find(p=>p.id===k);return `<div class="ln"><div class="th" style="background-image:url(cb/${x.w}.jpg)"></div><div class="nm">${x.ar}<br><small style="color:var(--muted)">${cart[k]} × ${x.p} ${CUR}</small></div><button class="pbtn" onclick="chg('${k}',-1)">−</button><b>${cart[k]}</b><button class="pbtn" onclick="chg('${k}',1)">+</button></div>`}).join(''):'<div class="empty">برطمانك فارغ، اختر كوكيز من القصص 🍪</div>';
 st.textContent=t+' '+CUR;okBtn.style.display=n?'':'none'}
function chg(k,d){cart[k]+=d;if(cart[k]<=0)delete cart[k];paint()}
function openJar(){paint();sheet.classList.add('show')}
jar.onclick=openJar;
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('show')};
okBtn.onclick=()=>{sheet.classList.remove('show');const ws=Object.keys(cart).map(k=>P.find(p=>p.id===k).w);let r='';
 for(let k=0;k<22;k++)r+=`<div class="rain" style="left:${Math.random()*95}%;background-image:url(cb/${ws[k%ws.length]}.jpg);animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.8}s"></div>`;
 thanks.innerHTML=r+thanks.innerHTML.replace(/<div class="rain"[^>]*><\/div>/g,'');thanks.classList.add('show');setTimeout(()=>{thanks.classList.remove('show');cart={};paint()},3400)};
paint();
</script>
</body>
</html>
