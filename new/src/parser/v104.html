<script id="EMD-V104-places">
(function(){
'use strict';
if(window.__EMD_V104__)return;window.__EMD_V104__=true;
/* V104: ولايات سلطنة عُمان — تعرّف تلقائي في تحليل الرسائل (حتى بدون «ال» أو بأخطاء بسيطة) + اختيار سريع في خانة المكان */
var GOV=[
 ['مسقط',['مسقط','مطرح','بوشر','السيب','العامرات','قريات']],
 ['ظفار',['صلالة','طاقة','مرباط','رخيوت','ثمريت','ضلكوت','المزيونة','مقشن','شليم وجزر الحلانيات','سدح']],
 ['مسندم',['خصب','دبا','بخا','مدحاء']],
 ['البريمي',['البريمي','محضة','السنينة']],
 ['الداخلية',['نزوى','بهلاء','منح','الحمراء','أدم','إزكي','سمائل','بدبد','الجبل الأخضر']],
 ['شمال الباطنة',['صحار','شناص','لوى','صحم','الخابورة','السويق']],
 ['جنوب الباطنة',['الرستاق','العوابي','نخل','وادي المعاول','بركاء','المصنعة']],
 ['جنوب الشرقية',['صور','الكامل والوافي','جعلان بني بو حسن','جعلان بني بو علي','مصيرة']],
 ['شمال الشرقية',['إبراء','المضيبي','بدية','القابل','وادي بني خالد','دماء والطائيين']],
 ['الظاهرة',['عبري','ينقل','ضنك']],
 ['الوسطى',['هيماء','محوت','الدقم','الجازر']]];
var EXTRA={'لوى':['ليوا','لوا'],'بهلاء':['بهلا'],'إبراء':['ابرا'],'هيماء':['هيما'],'مدحاء':['مدحا'],'بركاء':['بركا'],'دماء والطائيين':['دما والطايين','دماء والطايين','دما والطائيين','دما'],'شليم وجزر الحلانيات':['شليم','جزر الحلانيات','الحلانيات','جزر شليم والحلانيات'],
  'جعلان بني بو علي':['جعلان بني بوعلي','بني بو علي','بني بوعلي','جعلان بو علي','جعلان'],'جعلان بني بو حسن':['جعلان بني بوحسن','بني بو حسن','بني بوحسن','جعلان بو حسن'],'الكامل والوافي':['الكامل','كامل ووافي'],
  'وادي المعاول':['المعاول'],'وادي بني خالد':['بني خالد'],'ثمريت':['ثمريط'],'سمائل':['سمايل'],'نزوى':['نزوي'],'الجبل الأخضر':['الجبل'],'صلالة':['صلاله'],'إزكي':['ازكي'],'محضة':['محضه'],'مصيرة':['مصيره','جزيرة مصيرة']};
/* كلمات لها معنى ثاني (آدم اسم، صور = صور، طاقة…) — ما نعتبرها ولاية إلا إذا كانت لحالها في سطر المكان */
var AMB={'منح':1,'ادم':1,'نخل':1,'طاقه':1,'صور':1,'كامل':1,'الكامل':1,'قابل':1,'القابل':1,'ضنك':1,'سدح':1,'دبا':1,'بخا':1,'الجبل':1,'جعلان':1,'دما':1,'شليم':1,'حمراء':1,'الحمراء':1,'لوا':1};
var AR='٠١٢٣٤٥٦٧٨٩';
function dig(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return AR.indexOf(d)})}
function N(s){return dig(s).replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[ً-ٰٟـ]/g,'').replace(/[^ء-ي0-9a-z\s]/gi,' ').replace(/\s+/g,' ').trim().toLowerCase()}
function K(s){return N(s).split(' ').map(function(w){return w.replace(/ء$/,'')}).join(' ')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var LIST=[],KEYS=[],BYC={};
GOV.forEach(function(g){g[1].forEach(function(c){var o={c:c,g:g[0],keys:{}};LIST.push(o);BYC[c]=o;
  [c].concat(EXTRA[c]||[]).forEach(function(v){var k=K(v);if(!k)return;o.keys[k]=1;if(/^ال/.test(k)&&k.length>4)o.keys[k.slice(2)]=1});
  Object.keys(o.keys).forEach(function(k){KEYS.push({k:k,w:k.split(' '),o:o,amb:!!AMB[k]})})})});
KEYS.sort(function(a,b){return b.w.length-a.w.length||b.k.length-a.k.length});
var GOVK=['محافظه','ولايه','منطقه','سلطنه عمان','عمان','الباطنه جنوب','جنوب الباطنه','الباطنه شمال','شمال الباطنه','الشرقيه جنوب','جنوب الشرقيه','الشرقيه شمال','شمال الشرقيه','الباطنه','الشرقيه','الداخليه','الظاهره','الوسطي','ظفار','مسندم','جنوب','شمال'].map(K);
function tokStrip(t){if(/^(?:بال|وال|فال)/.test(t)&&t.length>5)return ['ال'+t.slice(3),t];if(/^لل/.test(t)&&t.length>4)return ['ال'+t.slice(2),t];if(/^و/.test(t)&&t.length>3)return [t.slice(1),t];return [t]}
/* يدوّر على ولاية داخل نص؛ strict = لا نقبل الكلمات المزدوجة المعنى إلا إذا كانت هي النص كله */
function find(text,strict){var w=K(text).split(' ').filter(Boolean);if(!w.length)return null;
  for(var i=0;i<w.length;i++){for(var j=0;j<KEYS.length;j++){var e=KEYS[j],n=e.w.length;if(i+n>w.length)continue;var ok=true;
      for(var z=0;z<n;z++){var cand=z===0?tokStrip(w[i]):[w[i+z]];if(cand.indexOf(e.w[z])<0){ok=false;break}}
      if(!ok)continue;if(e.amb&&strict&&w.length!==n)continue;return {o:e.o,i:i,n:n,words:w}}}
  return null}
/* أخطاء إملائية بسيطة لاسم ولاية لحاله: «الرستق» «صحاار» */
function lev(a,b){var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;for(i=1;i<=a.length;i++){var c=[i];for(j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function fuzzy(text){var k=K(text);if(!k||k.split(' ').length>3)return null;var best=null,bd=9;
  KEYS.forEach(function(e){if(e.amb||e.k.length<4)return;var d=lev(k,e.k);if(d<bd){bd=d;best=e}});
  return best&&bd===1&&k[0]===best.k[0]?best.o:null}
/* «الباطنه جنوب / العوابي» → «العوابي» ، «السيب الحيل الشماليه» → «السيب – الحيل الشماليه» */
function canon(value,strict){var v=String(value||'').trim();if(!v)return null;var f=find(v,strict);
  if(!f){var fz=fuzzy(v);return fz?{c:fz.c,g:fz.g,text:fz.c}:null}
  var rest=f.words.slice(0,f.i).concat(f.words.slice(f.i+f.n)).join(' ');
  GOVK.forEach(function(g){rest=(' '+rest+' ').replace(new RegExp(' '+g+' ','g'),' ').trim()});
  rest=rest.replace(/^(?:في|ب|الي|على|عند)\s+/,'').trim();
  var o=f.o,keep='';
  if(rest&&/[ء-ي]{2}/.test(rest)&&rest!==K(o.g)){var src=v.split(/\s+/),out=[];
    /* نرجّع التفاصيل بكتابتها الأصلية */
    var restW=rest.split(' ');src.forEach(function(t){var kt=K(t);if(kt&&restW.indexOf(kt)>=0){out.push(t.replace(/^[\/\-–،,]+|[\/\-–،,]+$/g,''));restW.splice(restW.indexOf(kt),1)}});keep=out.join(' ').trim()}
  return {c:o.c,g:o.g,text:o.c+(keep?' – '+keep:'')}}

/* ---------- قبل التحليل ---------- */
var PLBL=/^\s*(?:الولاي[ةه]|الولايه|ولاي[ةه]|المنطق[ةه]|منطق[ةه]|المحافظ[ةه]|الحي)\s*[:：\-]\s*/;
function pre(raw){var used=false;var out=String(raw||'').split('\n').map(function(l){
    if(PLBL.test(l)){used=true;l=l.replace(PLBL,'المكان: ')}
    var m=l.match(/^(\s*(?:المكان|مكان التوصيل|الموقع|موقع التوصيل|العنوان)\s*[:：]?\s*)(.+)$/);
    if(m){var c=canon(m[2],false);if(c&&K(c.text)!==K(m[2])){used=true;return m[1]+c.text}return l}
    var t=l.trim();if(!t||t.split(/\s+/).length>3||/\d/.test(t))return l;
    var f=find(t,true);if(f&&f.n===K(t).split(' ').length&&!AMB[K(t)]&&K(f.o.c)!==K(t)){used=true;return f.o.c}
    return l}).join('\n');return {text:out,used:used}}
/* ---------- بعد التحليل: تصحيح خانة المكان ---------- */
function $(id){return document.getElementById(id)}
function setVal(el,v){if(!el||el.value===v)return;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))}
function post(raw){var el=$('pplace');if(!el)return;var v=el.value.trim();
  if(v){var c=canon(v,false);if(c)setVal(el,c.text)}
  else{var nm=K(($('pname')||{}).value||'');var L=String(raw||'').split('\n');
    for(var i=0;i<L.length;i++){var l=L[i].replace(/^\s*(?:المكان|مكان التوصيل|الموقع|موقع التوصيل|العنوان|التوصيل)\s*[:：]?\s*/,'').trim();
      if(!l||/\d{4,}/.test(l)||l.split(/\s+/).length>5||K(l)===nm||/^(?:الاسم|اسم|اسمي)/.test(l))continue;
      var c2=canon(l,true);if(c2){setVal(el,c2.text);break}}}
  hint(el)}
function wrapParse(){var f=window.parse;if(typeof f!=='function'||f.__emd104)return;
  var g=function(){var ta=$('raw'),orig=ta?ta.value:'',p={text:orig};try{p=pre(orig)}catch(e){console.warn('V104 pre',e)}
    if(ta&&p.text!==orig)ta.value=p.text;var r;try{r=f.apply(this,arguments)}finally{if(ta)ta.value=orig}
    setTimeout(function(){try{post(orig)}catch(e){console.warn('V104 post',e)}},45);return r};
  try{Object.keys(f).forEach(function(k){g[k]=f[k]})}catch(e){}g.__emd104=true;window.parse=g}

/* ---------- خانة المكان: اقتراحات + كل الولايات ---------- */
function isPlaceInput(el){return el&&el.tagName==='INPUT'&&/place/i.test(el.id||'')&&!/search|filter/i.test(el.id)&&(el.type==='text'||el.type===''||el.type==='search')}
function recent(){var c={};try{((window.db&&window.db.orders)||[]).slice(-300).forEach(function(o){var x=canon(o&&o.place,false);if(x)c[x.c]=(c[x.c]||0)+1})}catch(e){}return Object.keys(c).sort(function(a,b){return c[b]-c[a]}).slice(0,6)}
function matches(q){var k=K(q).replace(/^ال/,'');if(!k)return [];var a=[],b=[];LIST.forEach(function(o){var hit=0;Object.keys(o.keys).forEach(function(x){var y=x.replace(/^ال/,'');if(y.indexOf(k)===0)hit=Math.max(hit,2);else if(y.indexOf(k)>0||x.indexOf(k)>=0)hit=Math.max(hit,1)});if(hit===2)a.push(o);else if(hit===1)b.push(o)});
  if(!a.length&&!b.length&&k.length>=4){var fz=fuzzy(q);if(fz)a.push(BYC[fz.c])}return a.concat(b).slice(0,8)}
function box(el){var s=el.__s104;if(s)return s;s=document.createElement('div');s.className='emd104-sug';s.hidden=true;
  var h=document.createElement('div');h.className='emd104-hint';h.hidden=true;
  el.insertAdjacentElement('afterend',s);s.insertAdjacentElement('afterend',h);el.__s104=s;el.__h104=h;
  s.addEventListener('pointerdown',function(e){if(e.target.closest('button'))e.preventDefault()});
  s.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.all){openPicker(el);return}pick(el,b.dataset.c)});
  return s}
function chip(o,sub){return '<button type="button" class="emd104-chip" data-c="'+esc(o.c)+'">📍 '+esc(o.c)+(sub?'<small>'+esc(o.g)+'</small>':'')+'</button>'}
function render(el){var s=box(el),v=el.value.trim(),h='';
  var cur=canon(v,false);
  if(!v){var r=recent().map(function(c){return BYC[c]}).filter(Boolean);h=r.map(function(o){return chip(o,false)}).join('')}
  else if(!cur||K(cur.text)!==K(v)){h=matches(v.split(/[–\-\/،,]/)[0]).map(function(o){return chip(o,true)}).join('')}
  h+='<button type="button" class="emd104-chip all" data-all="1">🗺️ كل الولايات</button>';
  s.innerHTML=h;s.hidden=false;hint(el)}
function hint(el){box(el);var h=el.__h104,c=canon(el.value,false);if(c){h.textContent='🗺️ محافظة '+c.g;h.hidden=false}else h.hidden=true}
function pick(el,c){var o=BYC[c];if(!o)return;var v=el.value.trim(),cur=canon(v,false),detail='';
  if(cur){var m=cur.text.split(' – ');detail=cur.c===o.c?(m[1]||''):''}else if(v&&!/[\d]{6,}/.test(v)&&!matches(v).some(function(x){return x.c===o.c}))detail=v;
  setVal(el,o.c+(detail?' – '+detail:''));el.__s104.hidden=true;hint(el);el.classList.remove('emd103-warn')}
document.addEventListener('focusin',function(e){var el=e.target;if(!isPlaceInput(el))return;render(el);if(!el.__l104){el.__l104=1;el.addEventListener('input',function(){render(el)});el.addEventListener('blur',function(){setTimeout(function(){if(document.activeElement!==el&&el.__s104)el.__s104.hidden=true},150)})}});

/* نافذة كل الولايات */
var ov=null,target=null;
function openPicker(el){target=el;if(!ov){ov=document.createElement('div');ov.className='emd93-ov';ov.innerHTML='<div class="emd93-box" role="dialog" aria-modal="true"></div>';document.body.appendChild(ov);document.body.classList.add('emd93-open');
    ov.addEventListener('click',function(e){if(e.target===ov)return closeP();var b=e.target.closest('button');if(!b)return;if(b.dataset.x)return closeP();if(b.dataset.c){pick(target,b.dataset.c);closeP()}});
    ov.addEventListener('input',function(e){if(e.target.id==='emd104Q')drawList(e.target.value)})}
  var cur=canon(el.value,false);
  ov.firstChild.innerHTML='<div class="emd93-head"><div><h3>🗺️ ولايات سلطنة عُمان</h3><small>اختر الولاية، وتقدر تكتب تفاصيل المكان بعدها.</small></div><button type="button" class="emd93-x" data-x="1" aria-label="إغلاق">✕</button></div><input class="emd104-q" id="emd104Q" type="search" placeholder="🔎 ابحث عن ولاية…"><div id="emd104L"></div>';
  ov.dataset.cur=cur?cur.c:'';drawList('')}
function drawList(q){var L=ov.querySelector('#emd104L'),m=q?matches(q):null,cur=ov.dataset.cur,h='';
  GOV.forEach(function(g){var items=g[1].filter(function(c){return !m||m.some(function(o){return o.c===c})});if(!items.length)return;
    h+='<div class="emd104-gov">محافظة '+esc(g[0])+'</div><div class="emd104-grid">'+items.map(function(c){return '<button type="button" data-c="'+esc(c)+'" class="'+(c===cur?'on':'')+'">'+esc(c)+'</button>'}).join('')+'</div>'});
  L.innerHTML=h||'<div class="emd93-note">ما لقينا ولاية بهذا الاسم.</div>'}
function closeP(){if(ov){ov.remove();ov=null}document.body.classList.remove('emd93-open');if(target)try{target.focus()}catch(e){}}

window.EMDPlacesV104={list:LIST,find:find,canon:canon,pre:pre,open:openPicker};
function boot(){wrapParse()}
boot();setTimeout(boot,1700);setTimeout(boot,4300);
})();
</script>
