<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>EMD Business — النسخة الجديدة (تجربة)</title>
<link rel="icon" href="logo.svg">
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--ink:#17212b;--mute:#64748b;--line:#e6eaf0;--soft:#f1f4f8;
  --navy:#0f172a;--navy2:#1e3a8a;--gold:#f5b301;--ok:#16a34a;--bad:#dc2626;
  --r:17px;--sh:0 10px 30px rgba(20,32,45,.06);
  --s-new:#2563eb;--s-waiting:#d97706;--s-ready:#16a34a;--s-packing:#7c3aed;--s-shipped:#0891b2;--s-received:#64748b;--s-cancelled:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.hide{display:none!important}

/* شريط التجربة */
#sbx{background:#fff7e6;border-bottom:1px solid #f6d58f;color:#7a4b00;font-size:13px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#sbx b{font-weight:800}
#sbx button{background:#fff;border:1px solid #f0c66b;border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700}

/* الرأس */
header{padding:14px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;border-radius:11px}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.3px}
.brand small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.hbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.hbtns button{white-space:nowrap}
.hbtns button{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14.5px}

/* الرئيسية */
#view>.hero{display:flex;justify-content:space-between;align-items:flex-start;margin:16px 0 12px}
#view>.hero h2{margin:0;font-size:24px;font-weight:900}
.clock{font-size:30px;font-weight:900;margin-top:4px;direction:ltr;text-align:right}
.clock bdi{direction:ltr;unicode-bidi:isolate;display:inline-block}.clock span{font-size:16px;font-weight:800;color:#475569}.clock .s{font-weight:700;color:#94a3b8}
.date{color:var(--mute);font-size:13px;font-weight:600}
.money{background:var(--navy);color:#fff;border-radius:18px;padding:14px 10px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-bottom:12px}
.money div+div{border-inline-start:1px solid rgba(255,255,255,.15)}
.money small{display:block;font-size:12px;color:#cbd5e1}
.money b{font-size:19px;font-weight:900}
.money .gold{color:var(--gold)}
.money .cap{grid-column:1/-1;border:0!important;font-size:11.5px;color:#94a3b8;margin-top:6px}
.himg{flex:0 0 112px;height:112px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.himg img{width:100%;height:100%;object-fit:cover}.himg.empty{border-style:dashed;color:var(--mute)}.himg.empty span{font-size:30px}.himg.empty small{font-size:12px}
.srow{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-top:4px}.srow img{width:34px;height:34px;border-radius:10px;object-fit:cover;border:1px solid #e5e7eb;background:#fff}.srow i{font-style:normal;width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center}
.himg.f-circle{border-radius:50%;padding:4px;border:0;background:var(--emd89-acc,#18202a);box-shadow:0 6px 18px rgba(15,23,42,.18)}.himg.f-circle img{border-radius:50%;border:3px solid #fff}
.himg.f-white{padding:6px;border:0;background:#fff;border-radius:26px;box-shadow:0 10px 26px rgba(15,23,42,.18);transform:rotate(-3deg)}.himg.f-white img{border-radius:20px}
.himg.f-grad{padding:4px;border:0;border-radius:28px;background:linear-gradient(135deg,var(--emd89-acc,#18202a),#f59e0b 55%,#ec4899)}.himg.f-grad img{border-radius:24px;border:3px solid #fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3 button{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:12px 4px;font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:6px}.grid3 button i{font-style:normal;font-size:24px}
.day{display:grid;gap:12px;margin-top:12px}.dcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}.dcard h3{margin:0 0 4px;font-size:17px}.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.dh small{color:var(--mute);font-size:12px}
.kp4,.kp3{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.kp3{grid-template-columns:repeat(3,1fr)}.kp4 div,.kp3 div{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.kp4 b,.kp3 b{display:block;font-size:20px;font-weight:900}.kp4 small,.kp3 small{color:var(--mute);font-size:11.5px}
.dsub{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}.dsub>b{display:block;margin-bottom:4px}.dsub>small{display:block;color:var(--mute);font-size:12.5px;margin-bottom:6px}.dsub h4{margin:4px 0;font-size:15px}.dsub p{margin:4px 0 8px;font-size:13.5px;line-height:1.7}
.irow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.irow small{display:block;color:var(--mute);font-size:12px}.btn.wide{width:100%}
.okbox{background:#ecfdf3;border:1px solid #bbf7d0;border-radius:12px;padding:10px;font-size:13px;margin:6px 0}.arow{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;margin:6px 0;text-align:right}.arow small{display:block;color:var(--mute);font-size:12px;font-weight:600}.arow i{font-style:normal;font-weight:900;font-size:18px;background:var(--card);border-radius:10px;padding:4px 10px}
.rowb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ph h2{margin:14px 0 2px;font-size:22px}.ph small{color:var(--mute)}.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.pgrid div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.pgrid small{display:block;color:var(--mute);font-size:12.5px}.pgrid b{font-size:22px;font-weight:900}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.pcard h3{margin:0 0 8px;font-size:16px}.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.prow small{display:block;color:var(--mute);font-size:12px}.prow .big{font-size:24px}.prow .bad{color:var(--bad)}
.prow.ln{border-top:1px solid var(--line);padding:9px 0}.pill{font-style:normal;font-size:12px;background:var(--soft);border-radius:999px;padding:3px 10px;color:var(--mute);white-space:nowrap}.pill.bad{color:var(--bad);background:#fef2f2}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:#16a34a}.tr380{margin:8px 0 0;padding:10px 12px;border:1px solid #dbeafe;background:#eff6ff;color:#1e3a8a;border-radius:12px;font-size:12px;line-height:1.6;font-weight:600}.tr70{margin:0 0 12px;padding:10px 12px;border-radius:14px;background:#fff7e6;color:#5b4300;font-size:14px}.nfm{display:grid;gap:6px;margin:10px 0;padding:10px;border:1px solid #e8edf2;border-radius:12px;background:#fafafa;font-size:13.5px}.nfm label{font-weight:800}.nfc{margin-top:10px}.nfc .note{color:var(--mute)}.nfok{color:#087443;font-weight:800;padding:10px 0}.nfr{background:#f4f6f8;color:#333;margin-top:10px}.nfwa{background:#087443;color:#fff;border-color:#087443}.okbox.nf166{background:#f1fbf5;border-color:#ccebd8;border-radius:14px;padding:12px;margin:10px 0 12px}.okbox.nf166>b{color:#087443}.okbox.nf166 .note{margin-top:6px;color:#666}
.tkc{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.tkc small{display:block;color:var(--mute);font-size:12.5px;margin-top:4px;word-break:break-all}.tkc small.ok{color:#15803d}
.msec{font-size:12.5px;font-weight:800;color:var(--mute);margin:14px 2px 8px}.mver{text-align:center;color:var(--mute);font-size:12px;margin-top:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:16px;text-align:right}
.stat b{display:block;font-size:30px;font-weight:900}
.stat span{display:flex;align-items:center;gap:0;font-weight:400;font-size:16px}.stat span>i{margin-inline-end:7px}
/* أيقونات V412 (نفس أنماط التطبيق الحالي) */
.emd412-i{display:inline-grid;place-items:center;flex:none;vertical-align:-0.28em;margin-inline-end:6px;line-height:1}
.emd412-i svg{display:block;width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.emd412-i svg .f{display:none}
body.emd412-s-line .emd412-i svg{stroke-width:1.5}body.emd412-s-bold .emd412-i svg{stroke-width:2.4}body.emd412-s-solid .emd412-i svg{fill:currentColor;stroke-width:1.2}body.emd412-s-solid .emd412-i svg .k{fill:none;stroke:var(--card,#fff);stroke-width:1.8}
body.emd412-s-duo .emd412-i svg .f{display:inline;fill:var(--c);fill-opacity:.24;stroke:none}body.emd412-s-duo .emd412-i{color:var(--c)}
body.emd412-s-tile .emd412-i{width:1.75em;height:1.75em;border-radius:.5em;background:var(--c);color:#fff}body.emd412-s-tile .emd412-i svg{width:1.05em;height:1.05em;stroke-width:2.1}
body.emd412-s-soft .emd412-i{width:1.85em;height:1.85em;border-radius:50%;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}body.emd412-s-soft .emd412-i svg{width:1.05em;height:1.05em;stroke-width:2.1}
body.emd412-s-gold .emd412-i{color:#b8892b}body.emd412-s-gold .emd412-i svg{stroke-width:1.6}
.stat .emd412-i{font-size:15px;margin-inline-end:7px}
/* تنبيه الطلب المكرر (V53) */
#emdDuplicateModal53{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:10150;padding:14px;overflow:auto}
.emd-dup53{max-width:650px;margin:30px auto;background:#fff;border-radius:22px;padding:22px;direction:rtl;box-shadow:0 20px 70px rgba(0,0,0,.28)}
.emd-dup53 .box{background:#f7f8fa;border-radius:15px;padding:14px;margin:12px 0}
.emd-dup53 .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.emd-dup53 button{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-size:15px}
.emd-dup53 .yes{background:#18202a;color:#fff}
.emd-dup53 .no{background:#eef2f6}
/* إبراز الحالات المهمة (V339) */
.emd339-priority{position:relative;box-shadow:0 0 0 2px var(--accent,#18202a),0 8px 22px rgba(24,32,42,.12)!important;transform:translateY(-1px)}.emd339-priority::after{content:'أولوية';position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:999px;background:var(--accent,#18202a);color:#fff;font-size:10px;font-weight:800}.stat.emd339-priority b{font-size:32px}
.stat.cc small{display:block;color:var(--mute);font-size:12px;margin-top:4px;font-weight:400}.stat.cc b{font-size:24px;font-variant-numeric:tabular-nums}.stat.cc.warn b{color:#b45309}.stat.cc.off b{color:#94a3b8}
.stat i{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border-radius:13px;padding:11px 15px;font-weight:800;font-size:15px;background:var(--soft);border:1px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.green{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.red{background:#fff;color:var(--bad);border-color:#f3c4c4}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:11px}
.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;width:100%;text-align:right}
.fold small{color:var(--mute);font-weight:600}

/* الطلبات */
.ptitle{font-size:24px;font-weight:900;margin:16px 0 2px}
.psub{color:var(--mute);font-size:13px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-weight:800;font-size:14px}
.chip.on{background:#fff3e6;border-color:#f6b77a}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:8px}
.search input{border:0;outline:0;flex:1;padding:12px 0;background:transparent}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}.cbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.cbadge{background:#f5f7f9;border-radius:999px;padding:5px 9px;font-size:12px}.clast{margin-top:10px;padding:10px;border-radius:12px;background:#f7f8fa;font-size:13px}.clast .mute{color:var(--mute)}.stk{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.stk b{font-size:15px}.stk .muted{color:var(--mute);font-size:13px}.stk .pimg{flex:none}.qlink{margin:4px 0 10px;font-size:15px;border-radius:14px;padding:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);border-inline-start:5px solid var(--sc,#94a3b8);padding:14px;margin-bottom:12px;content-visibility:auto;contain-intrinsic-size:260px}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ch h3{margin:0;font-size:17px;font-weight:900}
.pill{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.meta{color:var(--mute);font-size:13.5px;margin:4px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.tag{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12.5px;font-weight:700}
.tag.warn{background:#fff1f1;border-color:#f5c2c2;color:#9f1d1d}
.next{background:#fff7ec;border:1px solid #f8d3a6;color:#9a4b00;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:7px}
.acts .btn{flex:1 1 auto}
.acts .more{flex:0 0 46px}
.pin{color:var(--gold)}
.prow{display:flex;gap:12px;align-items:flex-start}
.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--soft);flex:0 0 64px;display:grid;place-items:center;font-size:26px}
.pbody{flex:1;min-width:0}
.pbody h3{margin:0 0 4px;font-size:16px;font-weight:900}
.nums{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.nums span{background:var(--soft);border-radius:8px;padding:3px 8px;font-weight:700}
.nums .low{background:#fff1f1;color:#9f1d1d}
.nums .okk{background:#ecfdf3;color:#166534}
.price{font-weight:900;font-size:15px;margin:2px 0 6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}
.kpi b{display:block;font-size:24px;font-weight:900}
.kpi span{color:var(--mute);font-size:13px;font-weight:700}
.imgpick{display:flex;gap:10px;align-items:center}
.imgpick .thumb{width:72px;height:72px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.moreBtn{display:block;margin:6px auto 20px}

/* الشريط السفلي */
nav#bar{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav#bar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mute);padding:4px 0;border-radius:12px;position:relative}
nav#bar button.on{background:#eef2ff;color:var(--ink)}
nav#bar .ic{font-size:20px;line-height:1.1}
nav#bar .plus .ic{background:var(--navy);color:#fff;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:26px;margin-top:-18px;box-shadow:0 6px 16px rgba(15,23,42,.3)}
.badge{position:absolute;top:0;inset-inline-start:calc(50% + 4px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

/* النوافذ */
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-16px;background:#fff;padding:4px 0 10px;z-index:2}
.sh h3{margin:0;font-size:21px;font-weight:900}
.sh small{display:block;color:var(--mute);font-size:12.5px;font-weight:600}
.x{background:var(--soft);border-radius:12px;padding:8px 13px;font-weight:700}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 5px}
label.f em{color:var(--bad);font-style:normal}
.in{width:100%;border:1px solid #d9dee6;border-radius:13px;padding:11px 12px;background:#fff;outline:0}
.in:focus{border-color:#93a4c3;box-shadow:0 0 0 3px #e7ecf6}
.row{display:flex;gap:8px}
.row>*{flex:1}
.items .it{display:grid;grid-template-columns:1fr 64px 84px 34px;gap:6px;margin-bottom:6px;align-items:center}
.items .it button{background:#fff1f1;color:var(--bad);border-radius:10px;height:42px;font-weight:900}
.items .it .from{grid-column:1/-1;font-size:12px;color:#92400e;font-weight:700;margin:-2px 2px 4px;line-height:1.6}
.items .it.amb select{border-color:#f59e0b;background:#fffbeb}
.left{margin:4px 0 10px;padding:10px 12px;border-radius:12px;background:#fffbeb;border:1px solid #fcd34d;color:#78350f;font-size:13px;font-weight:700;line-height:1.8}
.left b{background:#fef3c7;border-radius:6px;padding:1px 6px;margin:0 2px;display:inline-block}
.left small{display:block;font-weight:600;color:#a16207}
.cchip{border-radius:999px!important;font-size:12px!important}.cchip.ok{background:#ecfdf5!important;color:#065f46!important}.cchip.err{background:#fef2f2!important;color:#991b1b!important}
.pw{position:relative}.pw .eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:16px;cursor:pointer}

.cmsg{display:none;margin-top:8px;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:700}.cmsg.show{display:block}.cmsg.err{background:#fef2f2;color:#991b1b}.cmsg.ok{background:#ecfdf5;color:#065f46}.cmsg.info{background:#eff6ff;color:#1e40af}.bad{color:#991b1b}

  if(!e){e=document.createElement('div');e.id='rcAlert';e.className='rc-alert';document.body.appendChild(e)}

/* ===== lib/flow.js ===== */
/* دورة الطلب بعد الاعتماد: التجهيز ← الشحن ← الاستلام (نفس قواعد التطبيق الحالي)
   - لا يُشحن طلب قبل اكتمال قائمة تجهيزه (packed)
   - الشحن يحتاج شركة التوصيل، ويُخصم المخزون عند الشحن (setStatus)
   - الاستلام فقط لطلب مشحون */
function nowIso(){return new Date().toISOString()}
function addEvent(o,text){if(!Array.isArray(o.events))o.events=[];o.events.push({at:nowIso(),text:text})}
function packList(o){var c=Array.isArray(o.packingChecks)?o.packingChecks:[];return items(o).map(function(x,i){return {i:i,name:iname(x),q:qty(x),done:!!c[i]}})}
function packDone(o){var l=packList(o);return l.length>0&&l.every(function(x){return x.done})}
function setPackItem(o,i,on){if(!Array.isArray(o.packingChecks))o.packingChecks=[];o.packingChecks[i]=!!on;if(!on)o.packed=false;o.updatedAt=nowIso();save()}
function finishPacking(o){ // يكمل كل الأصناف ويعلّم الطلب «تم تجهيزه»
  if(!items(o).length)return false;
  o.packingChecks=items(o).map(function(){return true});
  if(status(o)==='ready')setStatus(o,'packing',true);
  if(o.packed!==true){o.packed=true;o.packedAt=o.packedAt||nowIso();addEvent(o,'✅ اكتمل تجهيز الطلب')}
  o.updatedAt=nowIso();dirty();save();return true;
}
function shipOrder(o,info){ // info: {company, method, tracking}
  if(o.packed!==true)return 'أكمل تجهيز الطلب أولًا.';
  var c=String(info.company||'').trim();if(!c)return 'اكتب شركة التوصيل.';
  var prev={company:o.company,method:o.method,deliveryMethod:o.deliveryMethod,tracking:o.tracking};
  o.company=c;if(info.method){o.method=info.method;o.deliveryMethod=info.method}
  if(info.tracking!=null)o.tracking=String(info.tracking).trim();
  if(!setStatus(o,'shipped',true)){Object.assign(o,prev);return 'تم إلغاء الشحن.'}
  o.handedToCourierAt=o.handedToCourierAt||nowIso();
  addEvent(o,'🚚 تم الشحن · '+c+(o.tracking?' · التتبع: '+o.tracking:''));save();return '';
}
function receiveOrder(o){
  if(status(o)!=='shipped')return 'هذا الطلب لم يُشحن بعد.';
  setStatus(o,'received',true);o.receiveConfirmed=true;addEvent(o,'📬 تم تأكيد استلام الطلب');save();return '';
}
function daysSince(iso){var t=new Date(iso||0).getTime();return t?Math.floor((Date.now()-t)/864e5):null}

/* ===== lib/sync.js ===== */
/* ---------- المزامنة بين الأجهزة: دمج على مستوى السجل ----------
   الصيغة نفسها التي يحفظها التطبيق الحالي في السحابة، حتى يعمل الجهازان معًا أثناء الانتقال:
   _u وقت آخر تعديل لكل طلب ومنتج وعميل، _o هوية الطلب، _tomb139 (طلبات ومنتجات محذوفة)،
   _tomb179 (عملاء محذوفون)، وorderSeq. القاعدة: الأحدث وقتًا هو المعتمد، والمخزون يُدمج بالفرق. */
var SY_RANK={'new':1,waiting:2,ready:3,packing:4,shipped:5,received:6};
var SY_RECS={orders:1,products:1,customers:1,_tomb139:1,_tomb179:1};
var SY_DROP={o:{_u:1,recoveredAt:1},p:{_u:1,stock:1,updatedAt:1},c:{_u:1,orders:1,updatedAt:1}};
var SY_TOMB_DAYS=90,SY_TOMB_MAX=10;
function fnv(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+'.'+s.length}
function hv(v){return v===undefined?'-':fnv(JSON.stringify(v))}
function syArr(a){return Array.isArray(a)?a:[]}
function isObj(x){return !!x&&typeof x==='object'&&!Array.isArray(x)}
function clone(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x))}
function syNorm(x){return String(x||'').replace(/ـ/g,'').trim().toLowerCase().replace(/\s+/g,' ')}
function kO(o){return o?oid(o):''}
function kP(p){return p?(p.id!=null&&p.id!==''?'i'+p.id:(syNorm(p.name)?'n'+syNorm(p.name):'')):''}
function kPT(p){return p?(syNorm(p.name)||(p.id!=null?'#'+p.id:'')):''}   // مفتاح المحذوفات والمخزون
function kC(c){return c?String(c.id||c.phone||c.name||''):''}
function oIdent(o){return o?String(o.created||o.createdAt||o.orderDate||o._o||''):''}
function oNum(o){var m=String(kO(o)).replace(/^#/,'').trim();return /^\d+$/.test(m)?+m:0}
function sigOf(o,drop){var c={};for(var k in o)if(!drop[k])c[k]=o[k];return fnv(JSON.stringify(c))}
function syStocks(d){var m={};syArr(d&&d.products).forEach(function(p){var k=kPT(p);if(k&&!(k in m))m[k]=num(p.stock)});return m}
function syDed(o){return !!(o&&o.stockDeducted===true&&o.stockReturned!==true)}
function syItems(o){return syArr(o&&(Array.isArray(o.products)?o.products:o.items)).map(function(x){return {k:syNorm(x&&(x.name||x.product||x.productName)),q:num(x&&(x.qty!=null?x.qty:(x.quantity!=null?x.quantity:x.count)))}}).filter(function(x){return x.k&&x.q>0})}

/* ===== ختم التعديلات: يُستدعى من الحفظ ===== */
var syCache=null;
function syStampList(list,kf,g,first,now){var b=syCache[g],seen={};
  syArr(list).forEach(function(o){if(!o||typeof o!=='object')return;var k=kf(o);if(!k||seen[k])return;seen[k]=1;var h=sigOf(o,SY_DROP[g]),c=b[k];
    if(!c){if(!o._u&&(!first||g==='o'))o._u=first?1:now;b[k]={h:h,u:o._u};return}
    if(o._u!==c.u){c.h=h;c.u=o._u;return}          // وصل من جهاز آخر بطابعه
    if(c.h!==h){o._u=now;c.h=h;c.u=now}});          // تعديل على هذا الجهاز
  Object.keys(b).forEach(function(k){if(!seen[k])delete b[k]})}
/* المحذوفات: ما يُحذف من هذا الجهاز لا يرجع من الجهاز الآخر (حتى 10 سجلات في المرة، وتُنسى بعد 90 يومًا) */
function syTomb(d,known,now){
  var cur={o:{},p:{},c:{}},t1=isObj(d._tomb139)?d._tomb139:{o:{},p:{}},t2=isObj(d._tomb179)?d._tomb179:{c:{}},T={o:t1.o||{},p:t1.p||{},c:t2.c||{}},ch=false;
  syArr(d.orders).forEach(function(o){var i=kO(o);if(i)cur.o[i]=1});syArr(d.products).forEach(function(p){var i=kPT(p);if(i)cur.p[i]=1});syArr(d.customers).forEach(function(c){var i=kC(c);if(i)cur.c[i]=1});
  if(known)['o','p','c'].forEach(function(g){var gone=Object.keys(known[g]||{}).filter(function(i){return !cur[g][i]});if(gone.length&&gone.length<=SY_TOMB_MAX)gone.forEach(function(i){T[g][i]=now;ch=true})});
  ['o','p','c'].forEach(function(g){Object.keys(T[g]).forEach(function(i){if(cur[g][i]||now-T[g][i]>SY_TOMB_DAYS*864e5){delete T[g][i];ch=true}})});
  if(ch||d._tomb139)d._tomb139={o:T.o,p:T.p};if(ch||d._tomb179)d._tomb179={c:T.c};
  return cur}
/* بداية الختم: تُسجَّل بصمة كل سجل كما هو الآن، فأي تعديل بعدها يُختم بوقته */
function syPrime(){syCache=null;if(db)syStamp(db,null)}
function syStamp(d,known,now){now=now||Date.now();var first=!syCache;if(first)syCache={o:{},p:{},c:{}};
  syStampList(d.orders,kO,'o',first,now);syStampList(d.products,kP,'p',first,now);syStampList(d.customers,kC,'c',first,now);
  syArr(d.orders).forEach(function(o){if(o&&typeof o==='object'&&!oIdent(o))o._o=now+'-'+Math.random().toString(36).slice(2,8)});
  return syTomb(d,known,now)}

/* ===== نقطة البداية المشتركة: شكل البيانات عند آخر تطابق مع السحابة ===== */

/* ===== lib/parseclean.js ===== */
/* ---------- تنظيف رسالة الطلب قبل التحليل (V120 في التطبيق الحالي) ----------
   أسطر القالب المعروفة، ورقم التحويل الخاص بالمتجر، و«(مكتب» بدون إغلاق، والكمية بين قوسين، والجمل التي يضيفها المستخدم (db.parseIgnore). */
function pcIgn(){var d=db;return d&&Array.isArray(d.parseIgnore)?d.parseIgnore.filter(Boolean):[]}
function pcDig(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}
var PC_BUILTIN=[/^\W*▫️/,/^\W*📖\s*المنتجات\s*المتوفرة/,/^\W*للطلب\s*أرسل\s*لنا/,/^\W*🛍️/,/⚠️?/,/اكتب\s*اسم\s*الكتاب/,/غي[ّر]*ر\s*الرقم\s*إذا/,/^\W*لتثبيت\s*الطلب/,/(?:حو[ّ]?ل|حوّل|حول)\s*(?:على|الى|إلى)\s*[\d٠-٩]{6,}/,/^\W*المنتج\s*\(?\s*العدد\s*\)?\W*$/,/^\W*صورة\s*التحويل/];
function parseClean(raw){
  var extra=pcIgn().map(function(x){return String(x).trim()}).filter(Boolean);
  var out=[];
  String(raw).split(/\r?\n/).forEach(function(line){
    var t=line.trim();
    if(t&&PC_BUILTIN.some(function(r){return r.test(t)}))return;
    if(t&&extra.some(function(x){return t.indexOf(x)>=0}))return;
    var m=t.match(/^[^\p{L}\p{N}]*التوصيل\s*[:：]?\s*\(?\s*(مكتب|مندوب|الى المنزل|إلى المنزل|استلام[^)\n]*)\)?\s*$/u);
    if(m){out.push('طريقة التوصيل: '+m[1].trim());return}
    var dm=t.match(/^(طريقة\s*التوصيل)\s*[:：]\s*\(?\s*([^()\n]*?)\s*\)?\s*$/);
    if(dm&&dm[2]){out.push(dm[1]+': '+dm[2]);return}
    /* الكمية بين قوسين: «- ( 2 ) اسم» أو «اسم - ( 2 )» → «اسم × 2» ليفهمها التحليل */
    var T=pcDig(t),q1=T.match(/^[-–—•·*]?\s*\(\s*(\d{1,3})\s*\)\s*[-–—:]?\s*(.+)$/),q2=T.match(/^[-–—•·*]?\s*(.*?[^\d\s(\-–—:])\s*[-–—:]?\s*\(\s*(\d{1,3})\s*\)\s*$/);
    if(q1&&!/^\d{6,}/.test(q1[2])&&/\D/.test(q1[2])){out.push(q1[2].trim()+' × '+q1[1]);return}
    if(q2&&!/(?:الهاتف|الرقم|الاسم|الولاية|المكان|التوصيل)/.test(q2[1])){out.push(q2[1].trim()+' × '+q2[2]);return}
    out.push(line)});
  return out.join('\n');
}

function dupSettings(){var d={};for(var k in DUP_DEF)d[k]=DUP_DEF[k];try{var x=JSON.parse(POS_LS.getItem('emd_duplicate_settings')||'{}');for(var j in x)d[j]=x[j]}catch(e){}return d}
function dupNorm(s){return String(s==null?'':s).trim().toLowerCase().replace(/[ً-ٰٟ]/g,'').replace(/\s+/g,' ')}
function dupDig(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))}).replace(/\D/g,'')}
function dupProds(o){var a=Array.isArray(o&&o.products)?o.products:(o&&o.product?[{name:o.product,qty:o.quantity||1}]:[]);
  return a.map(function(x){return {name:dupNorm(x.name||x.product),qty:Number(x.qty||x.quantity||1)}}).filter(function(x){return x.name}).sort(function(a,b){return a.name.localeCompare(b.name,'ar')})}
function dupSameItems(a,b){var x=dupProds(a),y=dupProds(b);if(!x.length||x.length!==y.length)return false;return x.every(function(v,i){return v.name===y[i].name&&v.qty===y[i].qty})}
function dupFind(obj){var s=dupSettings();if(!s.enabled)return null;
  var now=new Date(obj.orderDate||Date.now()),maxDays=Math.max(1,Number(s.days)||1);
  for(var i=0;i<db.orders.length;i++){var old=db.orders[i];if(!old||String(old.id)===String(obj.id))continue;
    var od=new Date(old.orderDate||old.created||0);if(isNaN(od.getTime()))continue;
    if(Math.abs(now.getTime()-od.getTime())>maxDays*864e5)continue;
    if(s.phone&&!(dupDig(obj.phone)&&dupDig(obj.phone)===dupDig(old.phone)))continue;
    if(s.place&&!(dupNorm(obj.place)&&dupNorm(obj.place)===dupNorm(old.place)))continue;
    if(s.items&&!dupSameItems(obj,old))continue;
    if(s.name&&dupNorm(obj.name)!==dupNorm(old.name))continue;
    if(!s.phone&&!s.place&&!s.items&&!s.name)continue;
    if(s.qty&&!dupSameItems({products:dupProds(obj)},{products:dupProds(old)}))continue;
    return old}
  return null}
function dupDate(v){var d=new Date(v||0);if(isNaN(d.getTime()))return 'تاريخ غير معروف';return d.toLocaleDateString('ar-OM',{year:'numeric',month:'numeric',day:'numeric'})+' · '+d.toLocaleTimeString('ar-OM',{hour:'2-digit',minute:'2-digit'})}

    '<div class="box"><b>📅 الطلب السابق</b><br>'+esc(idsFmt('#'+String(old.id||'').replace(/^#+/,'')))+' · '+esc(old.name||'اسم غير مذكور')+'<br>📱 '+esc(old.phone||'')+' · 📍 '+esc(old.place||'غير محدد')+'<br>📦 '+esc(its(old))+'<br>🕐 '+esc(dupDate(old.orderDate||old.created))+'</div>'+
    '<div class="box"><b>🔎 الطلب الحالي</b><br>📱 '+esc(obj.phone||'')+' · 📍 '+esc(obj.place||'غير محدد')+'<br>📦 '+esc(its(obj))+'</div>'+
    '<div class="actions"><button class="yes" type="button" data-d="yes">✅ نعم، هذا طلب جديد</button><button class="no" type="button" data-d="no">↩️ ألغي هذا الطلب</button></div></div>';
  m.addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(!b)return;m.remove();if(b.getAttribute('data-d')==='yes')go()});

function bindForm(box,o){
  var it=box.querySelector('#items');
  function recalc(){
    var its=readItems(box),sub=its.reduce(function(s,x){return s+x.unitPrice*x.qty},0),fee=num($('fFee').value),dis=num($('fDisc').value),t=Math.max(0,sub+fee-dis);
    var shortTxt='';
    its.forEach(function(x){var a=available(x.name,o);if(a!==null&&a<x.qty)shortTxt+='<div style="color:#b45309">⚠️ '+esc(x.name)+': المتوفر '+Math.max(0,a)+'</div>'});
    $('sumBox').innerHTML='<div><span>المنتجات</span><span>'+money(sub)+'</span></div>'+(fee?'<div><span>التوصيل</span><span>'+money(fee)+'</span></div>':'')+(dis?'<div><span>الخصم</span><span>− '+money(dis)+'</span></div>':'')+'<div class="t"><span>الإجمالي</span><span>'+money(t)+' '+CUR+'</span></div>'+shortTxt;
  }
  box.addEventListener('input',function(e){
    if(e.target.id==='fPhone')suggest(box,e.target.value);
    recalc();
  });
  box.addEventListener('change',function(e){
    if(e.target.dataset.k==='name'){var p=product(e.target.value),pr=e.target.closest('.it').querySelector('[data-k=price]');if(e.target.value)e.target.closest('.it').classList.remove('amb');if(p&&!num(pr.value))pr.value=money(catPrice(p))}
    recalc();
  });
  box.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.act==='addItem'){it.insertAdjacentHTML('beforeend',itemRow(null));recalc()}
    else if(b.dataset.act==='delItem'){if(it.children.length>1)b.closest('.it').remove();else b.closest('.it').querySelectorAll('input').forEach(function(i){i.value=i.dataset.k==='qty'?1:''});recalc()}
    else if(b.dataset.feep){box.querySelectorAll('#feeSeg button').forEach(function(x){x.classList.toggle('on',x===b)})}
    else if(b.dataset.pay){box.querySelectorAll('#paySeg button').forEach(function(x){x.classList.toggle('on',x===b)});$('partBox').classList.toggle('hide',b.dataset.pay!=='partial')}
    else if(b.dataset.cust!=null){var c=db.customers[+b.dataset.cust];$('fPhone').value=c.phone||'';if(!$('fName').value)$('fName').value=c.name||'';if(!$('fPlace').value)$('fPlace').value=c.place||'';$('sugg').innerHTML=''}
  });
  recalc();
}

  $('sugg').innerHTML=out.length?'<div class="sugg">'+out.map(function(i){var c=db.customers[i];return '<button type="button" data-cust="'+i+'">👤 '+esc(c.name||'بدون اسم')+' · '+esc(c.phone)+(c.place?' · '+esc(c.place):'')+'</button>'}).join('')+'</div>':'';
}
function collect(box,o){
  var phone=$('fPhone').value.trim(),place=$('fPlace').value.trim(),its=readItems(box);
  var err=!phoneKey(phone)?'اكتب رقم العميل.':!place?'اكتب مكان التوصيل.':!its.length?'اختر منتجًا واحدًا على الأقل.':'';
  if(err){toast(err);return null}
  var pay=(box.querySelector('#paySeg .on')||{}).dataset;pay=pay?pay.pay:'unpaid';
  o.name=$('fName').value.trim();o.phone=phone;o.place=place;
  o.company=$('fCompany').value.trim();o.method=$('fMethod').value;o.orderSource=$('fSource').value;
  o.paymentMethod=$('fPayM').value.trim();o.transfer=$('fTransfer').value.trim();o.beneficiary=$('fBenef').value.trim();o.due=$('fDue').value;o.note=$('fNote').value.trim();if($('fNotify')){o.notifyOnAvailable=$('fNotify').checked;o.notifyStatus=o.notifyOnAvailable?(o.notifyStatus==='sent_manual'?'sent_manual':'waiting'):'none'}
  o.products=its;if(o.items&&o.products!==o.items)delete o.items;
  o.deliveryFee=num($('fFee').value);o.discount=num($('fDisc').value);
  var fp=box.querySelector('#feeSeg .on');if(fp)o.feePaid=fp.dataset.feep;
  o.subtotal=its.reduce(function(s,x){return s+x.unitPrice*x.qty},0);
  o.total=Math.max(0,o.subtotal+o.deliveryFee-o.discount);o.pricingEnabled=true;
  if(pay==='paid'){o.paymentStatus='paid';o.paidAmount=o.total}

  o.updatedAt=new Date().toISOString();

}

var LATE_DAYS=3;
function byOld(a,b){var x=odate(a),y=odate(b);return (x?x.getTime():0)-(y?y.getTime():0)}
function prepLists(){
  var r={ready:[],packing:[],toShip:[],shipped:[],shippedToday:[],waiting:0,fresh:0},today=dkey(new Date());
  db.orders.forEach(function(o){var s=status(o);
    if(s==='ready')r.ready.push(o);else if(s==='packing'){r.packing.push(o);if(o.packed===true)r.toShip.push(o)}
    else if(s==='shipped'){r.shipped.push(o);var t=new Date(o.shippedAt||0);if(!isNaN(t)&&dkey(t)===today)r.shippedToday.push(o)}
    else if(s==='waiting')r.waiting++;else if(s==='new')r.fresh++});
  r.ready.sort(byOld);r.packing.sort(byOld);r.toShip.sort(byOld);
  r.shipped.sort(function(a,b){return new Date(a.shippedAt||0)-new Date(b.shippedAt||0)});
  return r;
}
function pickTotals(list){ // قائمة السحب: مجموع كل منتج في الطلبات المختارة

/* الخطوة التالية للطلب من أي مكان (البطاقة، التفاصيل، النقل) */
function advanceOrder(o){
  var s=status(o);
  if(s==='new'||s==='waiting'){if(s==='waiting'&&shortage(o).length){toast('⏳ المنتجات غير متوفرة بعد');return}setStatus(o,'ready');afterFlow();return}
  if(s==='ready'){packSheet(oid(o));return}
  if(s==='packing'){if(o.packed===true)shipSheet([oid(o)]);else packSheet(oid(o));return}
  if(s==='shipped'){if(confirm('تأكيد استلام العميل للطلب '+onum(o)+'؟')){receiveOrder(o);toast('📬 تم تأكيد الاستلام');afterFlow()}}
}
function moveOrder(o,to){
  var s=status(o);if(s===to)return;
  if(to==='shipped'){advanceToShip(o);return}
  if(to==='received'){if(s!=='shipped'){toast('يُؤكَّد الاستلام بعد شحن الطلب');return}receiveOrder(o);afterFlow();return}
  if(to==='packing'&&s!=='packing'){setStatus(o,'packing');packSheet(oid(o));return}
  if(setStatus(o,to))afterFlow();
}
function advanceToShip(o){var s=status(o);if(s==='shipped'||s==='received')return;if(s!=='packing'&&s!=='ready'){if(!confirm('هذا الطلب لم يُعتمد بعد. هل تريد تجهيزه وشحنه؟'))return}packSheet(oid(o))}

/* تقفيلة اليوم: ملخص اليوم، إرساله للمدير بواتساب أو بالبريد، وتذكير يومي بوقت محدد
   الإعدادات تُقرأ من التطبيق الحالي مرة واحدة (emd_v108_close) وتُحفظ في مفتاح التجربة */
var CLOSE_KEY='emd_rb_close',CLOSINGS_KEY='emd_rb_closings';
function closeCfg(){var c;try{c=JSON.parse(lsGet(CLOSE_KEY)||lsGet('emd_v108_close')||'{}')||{}}catch(e){c={}}if(c.enabled==null)c.enabled=true;c.time=c.time||'22:00';c.wa=c.wa||'';c.email=c.email||'';return c}
function closeSave(c){lsSet(CLOSE_KEY,JSON.stringify(c))}
function closings(){try{var a=JSON.parse(lsGet(CLOSINGS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function dayOf(v){var t=new Date(v||0);return isNaN(t)||t.getTime()<=0?'':dkey(t)}
function closingReport(dk){
  var r={dk:dk,newO:0,sales:0,paidToday:0,shipped:0,received:0,cancelled:0,prods:{},due:index().unpaid,ready:0,packing:0,waiting:0,low:[]};
  db.orders.forEach(function(o){var s=status(o),od=dayOf(o.orderDate||o.created||o.createdAt||o.date);
    if(s==='ready')r.ready++;else if(s==='packing')r.packing++;else if(s==='waiting')r.waiting++;
    if(od===dk){if(s==='cancelled')r.cancelled++;else{r.newO++;r.sales+=total(o);items(o).forEach(function(x){r.prods[iname(x)]=(r.prods[iname(x)]||0)+qty(x)})}}
    if(s!=='cancelled'&&dayOf(o.paidAt)===dk)r.paidToday+=paid(o);
    if(dayOf(o.shippedAt)===dk)r.shipped++;
    if(dayOf(o.receivedAt)===dk)r.received++});
  db.products.forEach(function(p){var a=available(p.name);if(a!==null&&a<=3)r.low.push(p.name+' ('+Math.max(0,a)+')')});
  r.ds=dsDay(dk);
  return r;
}
function closingText(r){
  var top=Object.keys(r.prods).sort(function(a,b){return r.prods[b]-r.prods[a]}).slice(0,5);
  var dl=new Date(r.dk+'T12:00:00').toLocaleDateString('ar-OM',{weekday:'long',day:'numeric',month:'long'});
  var t='📊 تقفيلة '+(storeName()||'المتجر')+' — '+dl+'\n\n'+
    '📦 طلبات اليوم: '+r.newO+'\n💰 مبيعات اليوم: '+money(r.sales)+' '+CUR+'\n✅ المحصّل اليوم: '+money(r.paidToday)+' '+CUR+'\n⏳ إجمالي غير المحصّل: '+money(r.due)+' '+CUR+'\n\n'+
    '🚚 شُحن اليوم: '+r.shipped+'\n📬 استلمها العملاء: '+r.received+(r.cancelled?'\n❌ ملغى: '+r.cancelled:'')+'\n\n'+
    '🟢 جاهز للتجهيز: '+r.ready+'\n🛠️ قيد التجهيز: '+r.packing+'\n⏳ بانتظار المنتجات: '+r.waiting+(r.ds.count?'\n\n🛍️ البيع المباشر اليوم: '+r.ds.count+' فاتورة — '+money(r.ds.sales)+' '+CUR:'');
  if(top.length)t+='\n\n🏆 الأكثر طلبًا اليوم:\n'+top.map(function(n){return '• '+n+' × '+r.prods[n]}).join('\n');
  if(r.low.length)t+='\n\n⚠️ مخزون قليل: '+r.low.slice(0,6).join('، ');
  return t+'\n\n— EMD Business';
}

   مركز الأداء (V20/V138) وإشعارات توفر المنتجات (V164/V166)، وصفحة «🔗 التتبع» (V316). كلها محسوبة من المكتبة، بلا مؤقتات. */
function insActive(){return db.orders.filter(function(o){var s=status(o);return s!=='received'&&s!=='cancelled'})}
function insToday(){var dk=dkey(new Date());return db.orders.filter(function(o){var t=odate(o);return t&&dkey(t)===dk})}
function insRow(o,btn){return '<div class="irow"><div><b>'+esc(onum(o))+'</b> — '+esc(cname(o)||'اسم غير مذكور')+'<small>📍 '+esc(cplace(o)||'غير محدد')+' · '+ST[status(o)].i+' '+ST[status(o)].l+(o.due?' · ⏰ قبل '+esc(o.due):'')+'</small></div>'+(btn||'<button class="btn sm dark" data-act="open" data-id="'+esc(oid(o))+'">التفاصيل</button>')+'</div>'}
function insAge(o){var t=new Date(o.shippedAt||o.updatedAt||0).getTime();return t?(Date.now()-t)/36e5:0}
function insReco(){var a=insActive(),c=function(s){return a.filter(function(o){return status(o)===s}).length},due=a.filter(function(o){return o.due}).length,w=c('waiting'),r=c('ready'),p=c('packing'),sh=c('shipped');
  if(due)return ['⏰ الأولوية الآن: مواعيد العملاء','عندك '+due+' طلب مرتبط بموعد أو مهلة. راجع هذه الطلبات أولًا حتى تضمن تجهيزها في الوقت المطلوب.','data-go="orders"','مراجعة المواعيد'];

function pStats(){var m={};db.orders.forEach(function(o){var s=String(o.status||'new'),act=['new','ready','packing'].indexOf(s)>=0&&o.stockDeducted!==true;

  return function(p){var r=m[p.name]||{t:0,a:0,w:0},stk=Number(p.stock)||0,res=Math.max(0,r.a);return {total:r.t,waiting:r.w,reserved:res,available:Math.max(0,stk-res),stock:stk}}}

    var k=0.72,out=c.toDataURL('image/jpeg',k);while(out.length>60000&&k>0.4){k-=0.08;out=c.toDataURL('image/jpeg',k)}cb(out)};im.onerror=function(){alert('تعذّر قراءة الصورة.')};im.src=e.target.result};r.readAsDataURL(file)}

/* بيانات تجريبية */
function demo(n){
  var P=[['عطر ليالي مسقط 100 مل',38,18],['دهن عود ملكي 12 مل',45,25],['عطر ورد طائفي 50 مل',29,13],['مسك أبيض 6 مل',8,3],['بخور مروكي فاخر',15,6],['مبخرة نحاسية',17.5,8],['طقم هدية عطر وبخور',55,28],['معطر مفارش 250 مل',7.5,3],['شموع معطرة',12,5],['ساعة كلاسيك ذهبية',64,35]];
  var products=P.map(function(x,i){return {name:x[0],salePrice:x[1],costPrice:x[2],stock:[40,20,30,90,60,10,8,50,0,5][i]*Math.max(1,Math.round(n/40)),category:''}});
  var names=['مريم الحارثية','سالم البلوشي','فاطمة الكندية','خالد العامري','عائشة الهنائية','يوسف الرواحي','أحمد الشكيلي','نورة السيابية','علي المعمري','هدى الزدجالية'];
  var places=['مسقط - الخوير','السيب - الموالح','نزوى - فرق','صحار - فلج القبائل','بوشر - العذيبة','صلالة - السعادة'];
  var sts=['new','waiting','ready','ready','packing','shipped','received','received','received','received'];
  var orders=[],now=Date.now(),seed=7;function rnd(m){seed=(seed*9301+49297)%233280;return Math.floor(seed/233280*m)}
  for(var i=0;i<n;i++){
    var its=[],k=1+rnd(3);for(var j=0;j<k;j++){var p=P[rnd(P.length)];its.push({name:p[0],qty:1+rnd(3),unitPrice:p[1]})}
    var sub=its.reduce(function(s,x){return s+x.qty*x.unitPrice},0),st=i<12?sts[i%sts.length]:(i<n*0.15?sts[rnd(6)]:'received');
    var at=new Date(now-(i*(n>100?0.6:6)+rnd(5))*36e5).toISOString(),pay=st==='received'||rnd(3)===0?'paid':'unpaid';
    var c=rnd(names.length);
    orders.push({id:'#'+String(n-i).padStart(4,'0'),name:names[c],phone:'9'+(1000000+c*7919%8999999),place:places[c%places.length],company:rnd(2)?'جيناكم':'',products:its,subtotal:sub,total:sub,deliveryFee:0,paymentStatus:pay,paidAmount:pay==='paid'?sub:0,status:st,stockDeducted:st==='shipped'||st==='received',created:at,orderDate:at,history:[{status:st,at:at}]});
  }
  var customers=names.map(function(nm,c){return {name:nm,phone:'9'+(1000000+c*7919%8999999),place:places[c%places.length],orders:[]}});
  return {orders:orders,products:products,customers:customers,orderSeq:n+1};
}

$('fileIn').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var raw=JSON.parse(r.result),d=raw&&raw.data&&raw.data.orders?raw.data:raw;
    if(raw&&raw.keys&&raw.keys[LIVE_KEY]){d=raw.keys[LIVE_KEY];if(typeof d==='string')d=JSON.parse(d)}
    if(!d||!Array.isArray(d.orders))throw 0;
    closeSheet();adopt(d,'file:'+f.name);boot();toast('📂 فُتحت النسخة، عدد الطلبات: '+d.orders.length);
  }catch(e){toast('تعذر قراءة الملف. اختر ملف نسخة احتياطية من EMD Business.')}};
  r.readAsText(f);this.value='';
});
