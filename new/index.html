<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>EMD Business — النسخة الجديدة (تجربة)</title>
<link rel="icon" href="logo.svg">
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--ink:#17212b;--mute:#64748b;--line:#e6eaf0;--soft:#f1f4f8;
  --navy:#0f172a;--navy2:#1e3a8a;--gold:#f5b301;--ok:#16a34a;--bad:#dc2626;
  --r:17px;--sh:0 10px 30px rgba(20,32,45,.06);
  --s-new:#2563eb;--s-waiting:#d97706;--s-ready:#16a34a;--s-packing:#7c3aed;--s-shipped:#0891b2;--s-received:#64748b;--s-cancelled:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.hide{display:none!important}

/* شريط التجربة */
#sbx{background:#fff7e6;border-bottom:1px solid #f6d58f;color:#7a4b00;font-size:13px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#sbx b{font-weight:800}
#sbx button{background:#fff;border:1px solid #f0c66b;border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:700}

/* الرأس */
header{padding:14px 0 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;border-radius:11px}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.3px}
.brand small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.hbtns{display:flex;gap:8px;margin-top:10px}
.hbtns button{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:14.5px}

/* الرئيسية */
.hero{display:flex;justify-content:space-between;align-items:flex-start;margin:16px 0 12px}
.hero h2{margin:0;font-size:24px;font-weight:900}
.clock{font-size:34px;font-weight:900;margin-top:4px;direction:ltr;text-align:right}
.clock span{font-size:16px;color:var(--mute)}
.date{color:var(--mute);font-size:13px;font-weight:600}
.money{background:var(--navy);color:#fff;border-radius:18px;padding:14px 10px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-bottom:12px}
.money div+div{border-inline-start:1px solid rgba(255,255,255,.15)}
.money small{display:block;font-size:12px;color:#cbd5e1}
.money b{font-size:19px;font-weight:900}
.money .gold{color:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:14px;text-align:right}
.stat b{display:block;font-size:30px;font-weight:900;text-align:left}
.stat span{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.stat i{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border-radius:13px;padding:11px 15px;font-weight:800;font-size:15px;background:var(--soft);border:1px solid var(--line)}
.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.green{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.red{background:#fff;color:var(--bad);border-color:#f3c4c4}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:11px}
.fold{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:800;width:100%;text-align:right}
.fold small{color:var(--mute);font-weight:600}

/* الطلبات */
.ptitle{font-size:24px;font-weight:900;margin:16px 0 2px}
.psub{color:var(--mute);font-size:13px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-weight:800;font-size:14px}
.chip.on{background:#fff3e6;border-color:#f6b77a}
.search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:8px}
.search input{border:0;outline:0;flex:1;padding:12px 0;background:transparent}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);border-inline-start:5px solid var(--sc,#94a3b8);padding:14px;margin-bottom:12px;content-visibility:auto;contain-intrinsic-size:260px}
.ch{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ch h3{margin:0;font-size:17px;font-weight:900}
.pill{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.meta{color:var(--mute);font-size:13.5px;margin:4px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
.tag{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:4px 8px;font-size:12.5px;font-weight:700}
.tag.warn{background:#fff1f1;border-color:#f5c2c2;color:#9f1d1d}
.next{background:#fff7ec;border:1px solid #f8d3a6;color:#9a4b00;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;margin:10px 0}
.acts{display:flex;flex-wrap:wrap;gap:7px}
.acts .btn{flex:1 1 auto}
.acts .more{flex:0 0 46px}
.pin{color:var(--gold)}
.prow{display:flex;gap:12px;align-items:flex-start}
.thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--soft);flex:0 0 64px;display:grid;place-items:center;font-size:26px}
.pbody{flex:1;min-width:0}
.pbody h3{margin:0 0 4px;font-size:16px;font-weight:900}
.nums{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.nums span{background:var(--soft);border-radius:8px;padding:3px 8px;font-weight:700}
.nums .low{background:#fff1f1;color:#9f1d1d}
.nums .okk{background:#ecfdf3;color:#166534}
.price{font-weight:900;font-size:15px;margin:2px 0 6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}
.kpi b{display:block;font-size:24px;font-weight:900}
.kpi span{color:var(--mute);font-size:13px;font-weight:700}
.imgpick{display:flex;gap:10px;align-items:center}
.imgpick .thumb{width:72px;height:72px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.moreBtn{display:block;margin:6px auto 20px}

/* الشريط السفلي */
nav#bar{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
nav#bar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--mute);padding:4px 0;border-radius:12px;position:relative}
nav#bar button.on{background:#eef2ff;color:var(--ink)}
nav#bar .ic{font-size:20px;line-height:1.1}
nav#bar .plus .ic{background:var(--navy);color:#fff;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:26px;margin-top:-18px;box-shadow:0 6px 16px rgba(15,23,42,.3)}
.badge{position:absolute;top:0;inset-inline-start:calc(50% + 4px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

/* النوافذ */
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-16px;background:#fff;padding:4px 0 10px;z-index:2}
.sh h3{margin:0;font-size:21px;font-weight:900}
.sh small{display:block;color:var(--mute);font-size:12.5px;font-weight:600}
.x{background:var(--soft);border-radius:12px;padding:8px 13px;font-weight:700}
label.f{display:block;font-weight:800;font-size:14px;margin:12px 0 5px}
label.f em{color:var(--bad);font-style:normal}
.in{width:100%;border:1px solid #d9dee6;border-radius:13px;padding:11px 12px;background:#fff;outline:0}
.in:focus{border-color:#93a4c3;box-shadow:0 0 0 3px #e7ecf6}
.row{display:flex;gap:8px}
.row>*{flex:1}
.items .it{display:grid;grid-template-columns:1fr 64px 84px 34px;gap:6px;margin-bottom:6px;align-items:center}
.items .it button{background:#fff1f1;color:var(--bad);border-radius:10px;height:42px;font-weight:900}
.items .it .from{grid-column:1/-1;font-size:12px;color:#92400e;font-weight:700;margin:-2px 2px 4px;line-height:1.6}
.items .it.amb select{border-color:#f59e0b;background:#fffbeb}
.left{margin:4px 0 10px;padding:10px 12px;border-radius:12px;background:#fffbeb;border:1px solid #fcd34d;color:#78350f;font-size:13px;font-weight:700;line-height:1.8}
.left b{background:#fef3c7;border-radius:6px;padding:1px 6px;margin:0 2px;display:inline-block}
.left small{display:block;font-weight:600;color:#a16207}
.cltxt{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:13px;margin:8px 0;max-height:40vh;overflow:auto}
.okbar{margin:4px 0 10px;padding:9px 12px;border-radius:12px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:13px;font-weight:700}
textarea.msg{min-height:190px;font-size:15px;line-height:1.7}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-weight:800;font-size:14px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ptabs{margin:4px 0 12px}.ptabs small{opacity:.75;font-weight:700}
.kpis.k4{grid-template-columns:1fr 1fr}.kpis.k4 .kpi b{font-size:20px}
details.pick{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 12px;margin-bottom:10px}details.pick summary{font-weight:800;cursor:pointer}
details.pick table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}details.pick td,details.pick th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:right}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--navy)}
.card.sel{outline:2px solid var(--gold,#d4a017)}
.prog{height:7px;border-radius:9px;background:#eef2f7;overflow:hidden;margin:8px 0 2px}.prog span{display:block;height:100%;background:var(--ok,#16a34a)}.prog.big{height:11px}
.lbpv img{width:100%;max-width:340px;display:block;margin:10px auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.invpv{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;overflow:auto;max-height:52vh;margin-bottom:8px}.invpv h1{font-size:18px;margin:0}.invpv .ih{display:flex;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:8px}.invpv .it{text-align:left}.invpv .it b{color:#b8860b;font-size:18px}.invpv .cust{display:grid;gap:3px;margin:10px 0;padding:8px;background:#f8fafc;border-radius:8px}.invpv table{width:100%;border-collapse:collapse;margin:6px 0}.invpv td,.invpv th{border:1px solid var(--line);padding:5px;text-align:right}.invpv th{background:#f1f5f9}.invpv .tot{width:70%;margin-inline-start:auto}.invpv .tot .g td{background:var(--navy);color:#fff}.invpv .thanks{text-align:center;color:var(--mute)}.invpv .muted{color:var(--mute)}
.packl{margin:10px 0}.pk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}.pk input{width:24px;height:24px;accent-color:var(--ok,#16a34a)}.pk span{display:flex;flex-direction:column}.pk small{color:var(--mute)}.pk.done{background:#ecfdf5;border-color:#a7f3d0}
.selbar{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#0f172a;color:#fff;border-radius:16px;padding:10px;margin-top:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}.selbar .btn{flex:1;min-width:110px}.selbar b{width:100%}
.tools.center{justify-content:center;margin-top:12px}.sub{margin:16px 0 8px;font-size:16px}.late{color:var(--bad)}.mute{color:var(--mute)}
.sum{background:var(--soft);border-radius:13px;padding:10px 12px;margin-top:10px;font-weight:700;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .t{font-size:17px;font-weight:900}
.foot{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-18px;background:#fff;padding:10px 0}
.foot .btn{flex:1}
.sugg{border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.sugg button:last-child{border-bottom:0}
details.more{margin-top:12px;border:1px dashed #cfd6e2;border-radius:14px;padding:4px 12px 10px}
details.more summary{font-weight:800;padding:8px 0;cursor:pointer}
.hist{font-size:13px;color:var(--mute);margin-top:10px}
.hist div{padding:3px 0;border-bottom:1px dashed var(--line)}
.list button{display:block;width:100%;text-align:right;padding:13px 6px;border-bottom:1px solid var(--line);font-weight:700}
.note{color:var(--mute);font-size:13px;line-height:1.7}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;display:none;max-width:90vw;text-align:center}
.welcome{max-width:520px;margin:40px auto;background:#fff;border-radius:20px;padding:22px;box-shadow:var(--sh);text-align:center}
.welcome img{width:64px}
.welcome .btn{display:block;width:100%;margin-top:10px}
</style>
</head>
<body>
<div id="sbx"></div>
<div class="wrap">
  <header>
    <div class="brand"><img src="logo.svg" alt=""><div><h1>EMD Business</h1><small id="storeName">إدارة الطلبات والمخزون</small></div></div>
    <div class="hbtns"><button data-act="settings">⚙️ الإعدادات</button><button data-act="moreSheet">☰ المزيد</button></div>
  </header>
  <main id="view"></main>
</div>
<nav id="bar">
  <button data-go="home"><span class="ic">🏠</span>الرئيسية</button>
  <button data-go="orders"><span class="ic">📋</span>الطلبات</button>
  <button data-act="importMsg" class="plus"><span class="ic">＋</span>طلب جديد</button>
  <button data-act="alerts"><span class="ic">🔔</span>التنبيهات<span class="badge hide" id="alertBadge"></span></button>
  <button data-act="moreSheet"><span class="ic">☰</span>المزيد</button>
</nav>
<div id="sheets"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">

<script>
/* =========================================================
   EMD Business — النسخة الجديدة، المرحلة الأولى
   ملف واحد مرتب: البيانات ← الحسابات ← العرض ← الأحداث.
   لا تعديل على بيانات التطبيق الأصلي: كل التعديلات في نسخة تجريبية مستقلة.
   ========================================================= */
'use strict';
(function(){

/* ===== lib/store.js ===== */
/* ---------- 1) التخزين ---------- */
var LIVE_KEY='emd_business_v1';        // بيانات التطبيق الحالي (قراءة فقط هنا)
var KEY='emd_rb_sandbox_v1';           // نسخة التجربة
var META='emd_rb_sandbox_meta';
var LS=window.localStorage;
function lsGet(k){try{return LS.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{LS.setItem(k,v);return true}catch(e){toast('تعذر الحفظ: مساحة التخزين ممتلئة');return false}}

var db=null, meta={};
function load(){
  var raw=lsGet(KEY);
  try{meta=JSON.parse(lsGet(META)||'{}')||{}}catch(e){meta={}}
  if(raw){try{db=JSON.parse(raw)}catch(e){db=null}}
  return !!db;
}
function fix(d){
  d=d||{};
  if(!Array.isArray(d.orders))d.orders=[];
  if(!Array.isArray(d.products))d.products=[];
  if(!Array.isArray(d.customers))d.customers=[];
  return d;
}
function adopt(d,src){
  db=fix(d);meta={source:src,at:new Date().toISOString()};
  lsSet(PIN_KEY,src==='live'?(lsGet('emd_pinned_orders_v340')||'[]'):'[]');
  lsSet('emd_rb_learn232',src==='live'?(lsGet('emd_v232_learn')||'{}'):'{}');lsSet('emd_rb_learn103',src==='live'?(lsGet('emd_v103_learn')||'{}'):'{}');
  lsSet(KEY,JSON.stringify(db));lsSet(META,JSON.stringify(meta));
  dirty();
}
var saveT=0;
function save(){ // حفظ واحد مؤجل قليلًا بدل عشرات عمليات الحفظ المتتالية
  dirty();
  clearTimeout(saveT);
  saveT=setTimeout(function(){lsSet(KEY,JSON.stringify(db))},120);
}
window.addEventListener('pagehide',function(){if(saveT){clearTimeout(saveT);lsSet(KEY,JSON.stringify(db))}});

var PIN_KEY='emd_rb_pins_v1'; // تثبيت التجربة منفصل عن تثبيت التطبيق الأصلي
function pinned(){try{var a=JSON.parse(lsGet(PIN_KEY)||'[]');var m={};(Array.isArray(a)?a:[]).forEach(function(x){m[String(x)]=1});return m}catch(e){return {}}}
function setPin(id,on){var m=pinned();if(on)m[id]=1;else delete m[id];lsSet(PIN_KEY,JSON.stringify(Object.keys(m)));dirty()}
function companies(){try{var a=JSON.parse(lsGet('emd_v79_companies')||'[]');return Array.isArray(a)?a.map(function(x){return typeof x==='string'?x:(x&&x.name)||''}).filter(Boolean):[]}catch(e){return []}}
function storeName(){try{var p=JSON.parse(lsGet('emd_business_profile_v333')||'{}');return String(p.name||'').trim()}catch(e){return ''}}

/* ===== lib/util.js ===== */
/* ---------- 2) أدوات عامة ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function digits(s){return String(s==null?'':s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})}
function num(v){var x=parseFloat(digits(v).replace(/٫/g,'.').replace(/[,،\s]/g,''));return isFinite(x)?x:0}
function money(x){return (Math.round((x||0)*1000)/1000).toFixed(3)}
function normTxt(s){return digits(s).replace(/ـ/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase().replace(/\s+/g,' ').trim()}
function phoneKey(p){var d=digits(p).replace(/\D/g,'');if(d.indexOf('00968')===0)d=d.slice(5);else if(d.indexOf('968')===0&&d.length===11)d=d.slice(3);return d.slice(-8)}
function pad(n){return (n<10?'0':'')+n}
function dkey(t){return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
var CUR='ر.ع';
function nOrders(n){return n===1?'طلب واحد':n===2?'طلبان':n>=3&&n<=10?n+' طلبات':n+' طلبًا'}

/* ===== lib/ui.js ===== */
function toast(t){var el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display='none'},2400)}
/* ---------- 5) النوافذ ---------- */
function openSheet(html,cls){
  var d=document.createElement('div');d.className='sheet '+(cls||'');d.innerHTML='<div class="box">'+html+'</div>';
  d.addEventListener('click',function(e){if(e.target===d)closeSheet(d)});
  $('sheets').appendChild(d);document.body.style.overflow='hidden';return d;
}
function closeSheetIfMenu(b){var s=b.closest('.sheet');if(s&&s.querySelector('.list'))closeSheet(s)}

/* تغيير الحالة مع ربط المخزون (نفس قواعد التطبيق الحالي: الخصم عند الشحن، والإرجاع عند الإلغاء) */
function setStatus(o,to,silent){
  var from=status(o);if(from===to)return true;
  if(to==='shipped'&&o.stockDeducted!==true){
    var sh=shortage(o);
    if(sh.length){
      var msg=sh.map(function(x){return x.missing?('• '+x.name+': غير مسجل في المنتجات'):('• '+x.name+': المطلوب '+x.need+' والمتوفر '+x.have)}).join('\n');
      if(!confirm('لا يكفي المخزون لشحن هذا الطلب:\n'+msg+'\n\nهل تريد الشحن دون خصم من المخزون؟'))return false;
    }else{
      items(o).forEach(function(x){var p=product(iname(x));if(p)p.stock=Math.max(0,num(p.stock)-qty(x))});
      o.stockDeducted=true;o.stockDeductedAt=new Date().toISOString();
    }
    o.shippedAt=o.shippedAt||new Date().toISOString();
  }
  if(to==='cancelled'&&o.stockDeducted===true&&o.stockReturned!==true){
    if(confirm('هل تريد إرجاع منتجات هذا الطلب إلى المخزون؟')){
      items(o).forEach(function(x){var p=product(iname(x));if(p)p.stock=num(p.stock)+qty(x)});
      o.stockReturned=true;o.stockReturnedAt=new Date().toISOString();
    }
  }
  if(to==='received')o.receivedAt=o.receivedAt||new Date().toISOString();
  o.status=to;dirty();if(to==='cancelled')promoteWaiting();
  if(!Array.isArray(o.history))o.history=[];
  o.history.push({status:to,at:new Date().toISOString(),by:'rebuild'});
  o.updatedAt=new Date().toISOString();
  save();
  if(!silent)toast(ST[to].i+' '+onum(o)+' — '+ST[to].l);
  return true;
}
function upsertCustomer(o){

  var c=null;for(var i=0;i<db.customers.length;i++)if(phoneKey(db.customers[i].phone)===k){c=db.customers[i];break}
  if(!c){c={name:cname(o),phone:cphone(o),place:cplace(o),orders:[]};db.customers.push(c)}

}

var IX=null;

function index(){
  if(IX)return IX;
  var byName={},reserved={},counts={all:0,pinned:0},alerts=0,today=dkey(new Date()),mon=today.slice(0,7);
  var sales=0,unpaid=0,profit=0;
  Object.keys(ST).forEach(function(k){counts[k]=0});
  db.products.forEach(function(p){var k=normTxt(p.name);if(k)byName[k]=p});
  var pins=pinned();
  db.orders.forEach(function(o){
    var s=status(o);counts[s]++;if(s!=='cancelled')counts.all++;
    if(pins[oid(o)])counts.pinned++;
    if((s==='new'||s==='ready'||s==='packing')&&o.stockDeducted!==true){
      items(o).forEach(function(x){var k=normTxt(iname(x));reserved[k]=(reserved[k]||0)+qty(x)});
    }
    if(s==='cancelled')return;
    var t=odate(o),tot=total(o,byName);
    if(t){var dk=dkey(t);if(dk===today)sales+=tot;if(dk.slice(0,7)===mon)profit+=tot-cost(o,byName)}
    unpaid+=remaining(o,byName);
    if(s==='waiting'||(s==='new')||(s==='shipped'&&t&&Date.now()-t>5*864e5))alerts++;
  });
  IX={byName:byName,reserved:reserved,counts:counts,alerts:alerts,sales:sales,unpaid:unpaid,profit:profit};
  return IX;
}
function product(name,byName){return (byName||index().byName)[normTxt(name)]||null}
function catPrice(p){return p?firstPos([p.salePrice,p.unitPrice,p.price,p.defaultPrice]):0}
function catCost(p){return p?firstPos([p.costPrice,p.purchasePrice,p.cost,p.purchaseCost]):0}
function itemPrice(x,b){return firstPos([x.unitPrice,x.salePrice,x.price])||catPrice(product(iname(x),b))}

function subtotal(o,b){return items(o).reduce(function(s,x){return s+itemPrice(x,b)*qty(x)},0)}

function payState(o,b){var s=String(o.paymentStatus||'');if(s==='paid'||s==='transfer'||s==='cash')return 'paid';var p=num(o.paidAmount),t=total(o,b);if(t>0&&p>=t-0.0005)return 'paid';if(p>0||s==='partial')return 'partial';return 'unpaid'}
function paid(o,b){return payState(o,b)==='paid'?total(o,b):Math.min(num(o.paidAmount),total(o,b))}

/* ===== lib/stock.js ===== */
function available(name,excludeOrder){
  var p=product(name);if(!p)return null;
  var res=index().reserved[normTxt(name)]||0;
  if(excludeOrder&&(['new','ready','packing'].indexOf(status(excludeOrder))>=0)&&excludeOrder.stockDeducted!==true){
    items(excludeOrder).forEach(function(x){if(normTxt(iname(x))===normTxt(name))res-=qty(x)});
  }
  return Math.max(0,num(p.stock))-res;
}
function shortage(o){
  var out=[];items(o).forEach(function(x){var a=available(iname(x),o);if(a===null)out.push({name:iname(x),missing:true});else if(a<qty(x))out.push({name:iname(x),need:qty(x),have:Math.max(0,a)})});return out;
}
function demand(){ // كم مرة طُلب كل منتج في الطلبات غير الملغاة
  var m={};db.orders.forEach(function(o){if(status(o)==='cancelled')return;items(o).forEach(function(x){var k=normTxt(iname(x));m[k]=(m[k]||0)+qty(x)})});return m}
function promoteWaiting(){ // الطلبات المنتظرة التي توفرت منتجاتها تصبح جاهزة، الأقدم أولًا
  var w=db.orders.filter(function(o){return status(o)==='waiting'}).sort(function(a,b){var x=odate(a),y=odate(b);return (x?x.getTime():0)-(y?y.getTime():0)}),n=0;
  w.forEach(function(o){if(!shortage(o).length){o.status='ready';if(!Array.isArray(o.history))o.history=[];o.history.push({status:'ready',at:new Date().toISOString(),by:'rebuild-stock'});n++;dirty()}});
  return n;
}

/* ===== lib/flow.js ===== */
/* دورة الطلب بعد الاعتماد: التجهيز ← الشحن ← الاستلام (نفس قواعد التطبيق الحالي)
   - لا يُشحن طلب قبل اكتمال قائمة تجهيزه (packed)
   - الشحن يحتاج شركة التوصيل، ويُخصم المخزون عند الشحن (setStatus)
   - الاستلام فقط لطلب مشحون */
function nowIso(){return new Date().toISOString()}
function addEvent(o,text){if(!Array.isArray(o.events))o.events=[];o.events.push({at:nowIso(),text:text})}
function packList(o){var c=Array.isArray(o.packingChecks)?o.packingChecks:[];return items(o).map(function(x,i){return {i:i,name:iname(x),q:qty(x),done:!!c[i]}})}
function packDone(o){var l=packList(o);return l.length>0&&l.every(function(x){return x.done})}
function setPackItem(o,i,on){if(!Array.isArray(o.packingChecks))o.packingChecks=[];o.packingChecks[i]=!!on;if(!on)o.packed=false;o.updatedAt=nowIso();save()}
function finishPacking(o){ // يكمل كل الأصناف ويعلّم الطلب «تم تجهيزه»
  if(!items(o).length)return false;
  o.packingChecks=items(o).map(function(){return true});
  if(status(o)==='ready')setStatus(o,'packing',true);
  if(o.packed!==true){o.packed=true;o.packedAt=o.packedAt||nowIso();addEvent(o,'✅ اكتمل تجهيز الطلب')}
  o.updatedAt=nowIso();dirty();save();return true;
}
function shipOrder(o,info){ // info: {company, method, tracking}
  if(o.packed!==true)return 'أكمل تجهيز الطلب أولًا.';
  var c=String(info.company||'').trim();if(!c)return 'اكتب شركة التوصيل.';
  var prev={company:o.company,method:o.method,deliveryMethod:o.deliveryMethod,tracking:o.tracking};
  o.company=c;if(info.method){o.method=info.method;o.deliveryMethod=info.method}
  if(info.tracking!=null)o.tracking=String(info.tracking).trim();
  if(!setStatus(o,'shipped',true)){Object.assign(o,prev);return 'تم إلغاء الشحن.'}
  o.handedToCourierAt=o.handedToCourierAt||nowIso();
  addEvent(o,'🚚 تم الشحن · '+c+(o.tracking?' · التتبع: '+o.tracking:''));save();return '';
}
function receiveOrder(o){
  if(status(o)!=='shipped')return 'هذا الطلب لم يُشحن بعد.';
  setStatus(o,'received',true);o.receiveConfirmed=true;addEvent(o,'📬 تم تأكيد استلام الطلب');save();return '';
}
function daysSince(iso){var t=new Date(iso||0).getTime();return t?Math.floor((Date.now()-t)/864e5):null}

function bindForm(box,o){
  var it=box.querySelector('#items');
  function recalc(){
    var its=readItems(box),sub=its.reduce(function(s,x){return s+x.unitPrice*x.qty},0),fee=num($('fFee').value),dis=num($('fDisc').value),t=Math.max(0,sub+fee-dis);
    var shortTxt='';
    its.forEach(function(x){var a=available(x.name,o);if(a!==null&&a<x.qty)shortTxt+='<div style="color:#b45309">⚠️ '+esc(x.name)+': المتوفر '+Math.max(0,a)+'</div>'});
    $('sumBox').innerHTML='<div><span>المنتجات</span><span>'+money(sub)+'</span></div>'+(fee?'<div><span>التوصيل</span><span>'+money(fee)+'</span></div>':'')+(dis?'<div><span>الخصم</span><span>− '+money(dis)+'</span></div>':'')+'<div class="t"><span>الإجمالي</span><span>'+money(t)+' '+CUR+'</span></div>'+shortTxt;
  }
  box.addEventListener('input',function(e){
    if(e.target.id==='fPhone')suggest(box,e.target.value);
    recalc();
  });
  box.addEventListener('change',function(e){
    if(e.target.dataset.k==='name'){var p=product(e.target.value),pr=e.target.closest('.it').querySelector('[data-k=price]');if(e.target.value)e.target.closest('.it').classList.remove('amb');if(p&&!num(pr.value))pr.value=money(catPrice(p))}
    recalc();
  });
  box.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.act==='addItem'){it.insertAdjacentHTML('beforeend',itemRow(null));recalc()}
    else if(b.dataset.act==='delItem'){if(it.children.length>1)b.closest('.it').remove();else b.closest('.it').querySelectorAll('input').forEach(function(i){i.value=i.dataset.k==='qty'?1:''});recalc()}
    else if(b.dataset.pay){box.querySelectorAll('#paySeg button').forEach(function(x){x.classList.toggle('on',x===b)});$('partBox').classList.toggle('hide',b.dataset.pay!=='partial')}
    else if(b.dataset.cust!=null){var c=db.customers[+b.dataset.cust];$('fPhone').value=c.phone||'';if(!$('fName').value)$('fName').value=c.name||'';if(!$('fPlace').value)$('fPlace').value=c.place||'';$('sugg').innerHTML=''}
  });
  recalc();
}
function suggest(box,v){
  var k=phoneKey(v),out=[];
  if(k.length>=3)for(var i=0;i<db.customers.length&&out.length<4;i++){if(phoneKey(db.customers[i].phone).indexOf(k)>=0)out.push(i)}
  $('sugg').innerHTML=out.length?'<div class="sugg">'+out.map(function(i){var c=db.customers[i];return '<button type="button" data-cust="'+i+'">👤 '+esc(c.name||'بدون اسم')+' · '+esc(c.phone)+(c.place?' · '+esc(c.place):'')+'</button>'}).join('')+'</div>':'';
}
function collect(box,o){
  var phone=$('fPhone').value.trim(),place=$('fPlace').value.trim(),its=readItems(box);
  var err=!phoneKey(phone)?'اكتب رقم العميل.':!place?'اكتب مكان التوصيل.':!its.length?'اختر منتجًا واحدًا على الأقل.':'';
  if(err){toast(err);return null}
  var pay=(box.querySelector('#paySeg .on')||{}).dataset;pay=pay?pay.pay:'unpaid';
  o.name=$('fName').value.trim();o.phone=phone;o.place=place;
  o.company=$('fCompany').value.trim();o.method=$('fMethod').value;o.orderSource=$('fSource').value;
  o.paymentMethod=$('fPayM').value.trim();o.transfer=$('fTransfer').value.trim();o.beneficiary=$('fBenef').value.trim();o.due=$('fDue').value;o.note=$('fNote').value.trim();
  o.products=its;if(o.items&&o.products!==o.items)delete o.items;
  o.deliveryFee=num($('fFee').value);o.discount=num($('fDisc').value);
  o.subtotal=its.reduce(function(s,x){return s+x.unitPrice*x.qty},0);
  o.total=Math.max(0,o.subtotal+o.deliveryFee-o.discount);o.pricingEnabled=true;
  if(pay==='paid'){o.paymentStatus='paid';o.paidAmount=o.total}
  else if(pay==='partial'){o.paymentStatus='partial';o.paidAmount=Math.min(o.total,num($('fPaid').value))}
  else{o.paymentStatus='unpaid';o.paidAmount=0}
  if(o.paymentStatus!=='unpaid'&&!o.paidAt)o.paidAt=new Date().toISOString();
  o.remaining=Math.max(0,o.total-o.paidAmount);
  o.updatedAt=new Date().toISOString();
  return o;
}

function newOrder(pre,st){
  var head=st?'<div class="sh"><div><h3>👀 مراجعة الطلب قبل الحفظ</h3><small>فهمتُ الرسالة هكذا. راجعها ثم احفظ.</small></div><button class="x" data-act="close">إغلاق ✕</button></div>'+importBar(st)
    :'<div class="sh"><div><h3>✍️ طلب جديد</h3><small>الحقول الأساسية: الرقم والمكان والمنتجات.</small></div><button class="x" data-act="close">إغلاق ✕</button></div>';
  var d=openSheet(head+'<form id="frm" novalidate>'+formHtml(pre||null,true)+'<div class="foot"><button class="btn green" type="submit">✅ حفظ الطلب</button><button class="btn" type="button" data-act="'+(st?'backImport':'close')+'">'+(st?'↩️ تعديل الرسالة':'إلغاء')+'</button></div></form>');
  var box=d.querySelector('#frm');bindForm(box,null);
  if(pre&&pre.paymentStatus==='unpaid')box.querySelectorAll('#paySeg button').forEach(function(x){x.classList.toggle('on',x.dataset.pay==='unpaid')});
  setTimeout(function(){var f=$('fPhone');if(f&&!f.value)f.focus()},60);
  box.addEventListener('submit',function(e){
    e.preventDefault();
    var o=collect(box,{});if(!o)return;

function importSheet(msg){

function doParse(){
  var raw=($('rawMsg')||{}).value||'';if(!raw.trim()){toast('ألصق الرسالة أولًا');return}
  lastMsg=raw;
  loadParser().then(function(P){
    P.setup({prods:function(){return db.products},lk:'emd_rb_learn232',ak:'emd_rb_learn103'});

    var its=r.items.map(function(x){var p=x.p?product(x.p):null;return x.p?{name:x.p,qty:x.q,unitPrice:catPrice(p),parsed:1}:{name:'',qty:x.q,raw:x.raw,opts:x.opts,parsed:1}});

function learnImport(box,st,o){

/* ماذا أجهز الآن؟ — شاشة واحدة بثلاثة تبويبات: التجهيز، الشحن، الاستلام
   (تجمع مركز التجهيز، قائمة التجهيز، كشف التجهيز، التجهيز الجماعي، كشف تسليم الشركات، تأكيد الاستلام) */
var LATE_DAYS=3;
function byOld(a,b){var x=odate(a),y=odate(b);return (x?x.getTime():0)-(y?y.getTime():0)}
function prepLists(){
  var r={ready:[],packing:[],toShip:[],shipped:[],shippedToday:[],waiting:0,fresh:0},today=dkey(new Date());
  db.orders.forEach(function(o){var s=status(o);
    if(s==='ready')r.ready.push(o);else if(s==='packing'){r.packing.push(o);if(o.packed===true)r.toShip.push(o)}
    else if(s==='shipped'){r.shipped.push(o);var t=new Date(o.shippedAt||0);if(!isNaN(t)&&dkey(t)===today)r.shippedToday.push(o)}
    else if(s==='waiting')r.waiting++;else if(s==='new')r.fresh++});
  r.ready.sort(byOld);r.packing.sort(byOld);r.toShip.sort(byOld);
  r.shipped.sort(function(a,b){return new Date(a.shippedAt||0)-new Date(b.shippedAt||0)});
  return r;
}
function pickTotals(list){ // قائمة السحب: مجموع كل منتج في الطلبات المختارة
  var m={},order=[];list.forEach(function(o){if(o.packed===true)return;items(o).forEach(function(x){var k=normTxt(iname(x));if(!m[k]){m[k]={name:iname(x),q:0,n:0};order.push(k)}m[k].q+=qty(x);m[k].n++})});
  return order.map(function(k){return m[k]}).sort(function(a,b){return b.q-a.q});
}

function prepCard(o,mode){

  var pl=packList(o),done=pl.filter(function(x){return x.done}).length;
  var extra='';
  if(mode==='packing')extra='<div class="prog"><span style="width:'+(pl.length?Math.round(done/pl.length*100):0)+'%"></span></div><small class="mute">'+(o.packed===true?'✅ اكتمل التجهيز':'التقدم: '+done+' / '+pl.length)+'</small>';
  if(mode==='shipped'){var dd=daysSince(o.shippedAt);extra='<div class="meta">🚚 '+esc(o.company||'—')+(o.tracking?' · '+esc(o.tracking):'')+(dd!=null?' · <b class="'+(dd>=LATE_DAYS?'late':'')+'">منذ '+(dd===0?'اليوم':dd===1?'يوم':dd===2?'يومين':dd<=10?dd+' أيام':dd+' يومًا')+'</b>':'')+'</div>'}

  }else{
    var all=tab==='prep'?'selAllPrep':tab==='ship'?'selAllShip':'selAllRecv';

function afterFlow(){if(state.view==='prep')refreshPrep();else if(state.view==='orders')refreshList();else render();var b=$('alertBadge'),ix=index();b.textContent=ix.alerts;b.classList.toggle('hide',!ix.alerts)}
/* الخطوة التالية للطلب من أي مكان (البطاقة، التفاصيل، النقل) */
function advanceOrder(o){
  var s=status(o);
  if(s==='new'||s==='waiting'){if(s==='waiting'&&shortage(o).length){toast('⏳ المنتجات غير متوفرة بعد');return}setStatus(o,'ready');afterFlow();return}
  if(s==='ready'){packSheet(oid(o));return}
  if(s==='packing'){if(o.packed===true)shipSheet([oid(o)]);else packSheet(oid(o));return}
  if(s==='shipped'){if(confirm('تأكيد استلام العميل للطلب '+onum(o)+'؟')){receiveOrder(o);toast('📬 تم تأكيد الاستلام');afterFlow()}}
}
function moveOrder(o,to){
  var s=status(o);if(s===to)return;
  if(to==='shipped'){advanceToShip(o);return}
  if(to==='received'){if(s!=='shipped'){toast('يُؤكَّد الاستلام بعد شحن الطلب');return}receiveOrder(o);afterFlow();return}
  if(to==='packing'&&s!=='packing'){setStatus(o,'packing');packSheet(oid(o));return}
  if(setStatus(o,to))afterFlow();
}
function advanceToShip(o){var s=status(o);if(s==='shipped'||s==='received')return;if(s!=='packing'&&s!=='ready'){if(!confirm('هذا الطلب لم يُعتمد بعد. هل تريد تجهيزه وشحنه؟'))return}packSheet(oid(o))}

/* تقفيلة اليوم: ملخص اليوم، إرساله للمدير بواتساب أو بالبريد، وتذكير يومي بوقت محدد
   الإعدادات تُقرأ من التطبيق الحالي مرة واحدة (emd_v108_close) وتُحفظ في مفتاح التجربة */
var CLOSE_KEY='emd_rb_close',CLOSINGS_KEY='emd_rb_closings';
function closeCfg(){var c;try{c=JSON.parse(lsGet(CLOSE_KEY)||lsGet('emd_v108_close')||'{}')||{}}catch(e){c={}}if(c.enabled==null)c.enabled=true;c.time=c.time||'22:00';c.wa=c.wa||'';c.email=c.email||'';return c}
function closeSave(c){lsSet(CLOSE_KEY,JSON.stringify(c))}
function closings(){try{var a=JSON.parse(lsGet(CLOSINGS_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function dayOf(v){var t=new Date(v||0);return isNaN(t)||t.getTime()<=0?'':dkey(t)}
function closingReport(dk){
  var r={dk:dk,newO:0,sales:0,paidToday:0,shipped:0,received:0,cancelled:0,prods:{},due:index().unpaid,ready:0,packing:0,waiting:0,low:[]};
  db.orders.forEach(function(o){var s=status(o),od=dayOf(o.orderDate||o.created||o.createdAt||o.date);
    if(s==='ready')r.ready++;else if(s==='packing')r.packing++;else if(s==='waiting')r.waiting++;
    if(od===dk){if(s==='cancelled')r.cancelled++;else{r.newO++;r.sales+=total(o);items(o).forEach(function(x){r.prods[iname(x)]=(r.prods[iname(x)]||0)+qty(x)})}}
    if(s!=='cancelled'&&dayOf(o.paidAt)===dk)r.paidToday+=paid(o);
    if(dayOf(o.shippedAt)===dk)r.shipped++;
    if(dayOf(o.receivedAt)===dk)r.received++});
  db.products.forEach(function(p){var a=available(p.name);if(a!==null&&a<=3)r.low.push(p.name+' ('+Math.max(0,a)+')')});
  return r;
}
function closingText(r){
  var top=Object.keys(r.prods).sort(function(a,b){return r.prods[b]-r.prods[a]}).slice(0,5);
  var dl=new Date(r.dk+'T12:00:00').toLocaleDateString('ar-OM',{weekday:'long',day:'numeric',month:'long'});
  var t='📊 تقفيلة '+(storeName()||'المتجر')+' — '+dl+'\n\n'+
    '📦 طلبات اليوم: '+r.newO+'\n💰 مبيعات اليوم: '+money(r.sales)+' '+CUR+'\n✅ المحصّل اليوم: '+money(r.paidToday)+' '+CUR+'\n⏳ إجمالي غير المحصّل: '+money(r.due)+' '+CUR+'\n\n'+
    '🚚 شُحن اليوم: '+r.shipped+'\n📬 استلمها العملاء: '+r.received+(r.cancelled?'\n❌ ملغى: '+r.cancelled:'')+'\n\n'+
    '🟢 جاهز للتجهيز: '+r.ready+'\n🛠️ قيد التجهيز: '+r.packing+'\n⏳ بانتظار المنتجات: '+r.waiting;
  if(top.length)t+='\n\n🏆 الأكثر طلبًا اليوم:\n'+top.map(function(n){return '• '+n+' × '+r.prods[n]}).join('\n');
  if(r.low.length)t+='\n\n⚠️ مخزون قليل: '+r.low.slice(0,6).join('، ');
  return t+'\n\n— EMD Business';
}

    else if(k==='copy'){if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('📋 نُسخ الملخص')})}
    else if(k==='done'){var a=closings().filter(function(x){return x.dk!==today});a.push({dk:today,at:new Date().toISOString(),newO:r.newO,sales:r.sales,paidToday:r.paidToday});lsSet(CLOSINGS_KEY,JSON.stringify(a.slice(-120)));closeSheet(d);toast('🔒 تم تقفيل اليوم');closingSheet()}});

function demo(n){
  var P=[['عطر ليالي مسقط 100 مل',38,18],['دهن عود ملكي 12 مل',45,25],['عطر ورد طائفي 50 مل',29,13],['مسك أبيض 6 مل',8,3],['بخور مروكي فاخر',15,6],['مبخرة نحاسية',17.5,8],['طقم هدية عطر وبخور',55,28],['معطر مفارش 250 مل',7.5,3],['شموع معطرة',12,5],['ساعة كلاسيك ذهبية',64,35]];
  var products=P.map(function(x,i){return {name:x[0],salePrice:x[1],costPrice:x[2],stock:[40,20,30,90,60,10,8,50,0,5][i]*Math.max(1,Math.round(n/40)),category:''}});
  var names=['مريم الحارثية','سالم البلوشي','فاطمة الكندية','خالد العامري','عائشة الهنائية','يوسف الرواحي','أحمد الشكيلي','نورة السيابية','علي المعمري','هدى الزدجالية'];
  var places=['مسقط - الخوير','السيب - الموالح','نزوى - فرق','صحار - فلج القبائل','بوشر - العذيبة','صلالة - السعادة'];
  var sts=['new','waiting','ready','ready','packing','shipped','received','received','received','received'];
  var orders=[],now=Date.now(),seed=7;function rnd(m){seed=(seed*9301+49297)%233280;return Math.floor(seed/233280*m)}
  for(var i=0;i<n;i++){
    var its=[],k=1+rnd(3);for(var j=0;j<k;j++){var p=P[rnd(P.length)];its.push({name:p[0],qty:1+rnd(3),unitPrice:p[1]})}
    var sub=its.reduce(function(s,x){return s+x.qty*x.unitPrice},0),st=i<12?sts[i%sts.length]:(i<n*0.15?sts[rnd(6)]:'received');
    var at=new Date(now-(i*(n>100?0.6:6)+rnd(5))*36e5).toISOString(),pay=st==='received'||rnd(3)===0?'paid':'unpaid';
    var c=rnd(names.length);
    orders.push({id:'#'+String(n-i).padStart(4,'0'),name:names[c],phone:'9'+(1000000+c*7919%8999999),place:places[c%places.length],company:rnd(2)?'جيناكم':'',products:its,subtotal:sub,total:sub,deliveryFee:0,paymentStatus:pay,paidAmount:pay==='paid'?sub:0,status:st,stockDeducted:st==='shipped'||st==='received',created:at,orderDate:at,history:[{status:st,at:at}]});
  }
  var customers=names.map(function(nm,c){return {name:nm,phone:'9'+(1000000+c*7919%8999999),place:places[c%places.length],orders:[]}});
  return {orders:orders,products:products,customers:customers,orderSeq:n+1};
}

    case 'addProduct':productSheet(null);break;
    case 'editProduct':productSheet(+b.dataset.pi);break;
    case 'delProduct':{var pp=db.products[+b.dataset.pi];if(pp&&confirm('هل تريد حذف المنتج «'+pp.name+'»؟ الطلبات السابقة لا تتأثر.')){db.products.splice(+b.dataset.pi,1);save();closeSheet(b.closest('.sheet'));toast('🗑️ حُذف المنتج');render()}break}
    case 'addStock':addStockSheet(+b.dataset.pi);break;
    case 'orderProduct':{var pq=db.products[+b.dataset.pi];newOrder();if(pq){var sl=document.querySelector('#items select');sl.value=pq.name;sl.dispatchEvent(new Event('change',{bubbles:true}))}break}
    case 'stockLow':state.stockLow=!state.stockLow;render();break;
    case 'csort':state.csort=b.dataset.s;state.limit=30;render();break;
    case 'cProfile':customerProfile(ck(b));break;
    case 'cEdit':customerEdit(ck(b));break;
    case 'cWa':{var cc=custByKey(ck(b));if(cc)waOpen({phone:cc.phone,name:cc.name,status:'x',products:[]},true);break}
    case 'cNew':{var cn=custByKey(ck(b));closeSheet();newOrder();if(cn){$('fPhone').value=cn.phone;$('fName').value=cn.name||'';$('fPlace').value=cn.place||'';$('fPlace').dispatchEvent(new Event('input',{bubbles:true}))}break}
    case 'cAll':{var ca=custByKey(ck(b));closeSheet();state.view='orders';state.filter='all';state.q=ca?phoneKey(ca.phone):'';state.limit=30;render();window.scrollTo(0,0);break}
    case 'closing':var cs=b.closest('.sheet');if(cs)closeSheet(cs);closingSheet();break;
    case 'prepNow':state.view='prep';state.sel={};render();window.scrollTo(0,0);break;
    case 'moreSheet':moreSheet();break;
    case 'alerts':alertsSheet();break;
    case 'settings':settingsSheet();break;
    case 'soon':toast('«'+(b.dataset.what||'هذا القسم')+'» يُبنى في المرحلة القادمة');break;
    case 'recopy':recopy();break;
    case 'openFile':$('fileIn').click();break;
    case 'demo':closeSheet();adopt(demo(+b.dataset.n||40),'demo'+(b.dataset.n||40));boot();break;
  }
});
function ck(b){var c=b.closest('[data-ck]');return b.dataset.ck||(c&&c.dataset.ck)}
var qT=0;
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='q'){state.q=e.target.value;state.limit=30;clearTimeout(qT);qT=setTimeout(refreshList,180);return}
  if(id==='pq'||id==='cq'){state[id]=e.target.value;state.limit=30;clearTimeout(qT);qT=setTimeout(function(){var tmp=document.createElement('div');tmp.innerHTML=state.view==='products'?productsHtml():customersHtml();var L=id==='pq'?'#plist':'#clist';$(L.slice(1)).innerHTML=tmp.querySelector(L).innerHTML;var om=document.querySelector('.moreBtn'),nm=tmp.querySelector('.moreBtn');if(om)om.remove();if(nm)$(L.slice(1)).after(nm)},180)}
});
$('fileIn').addEventListener('change',function(){
  var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var raw=JSON.parse(r.result),d=raw&&raw.data&&raw.data.orders?raw.data:raw;
    if(raw&&raw.keys&&raw.keys[LIVE_KEY]){d=raw.keys[LIVE_KEY];if(typeof d==='string')d=JSON.parse(d)}
    if(!d||!Array.isArray(d.orders))throw 0;
    closeSheet();adopt(d,'file:'+f.name);boot();toast('📂 فُتحت النسخة، عدد الطلبات: '+d.orders.length);
  }catch(e){toast('تعذر قراءة الملف. اختر ملف نسخة احتياطية من EMD Business.')}};
  r.readAsText(f);this.value='';
});

function boot(){

  db=fix(db);dirty();banner();
  var sn=storeName();if(sn)$('storeName').textContent=sn;
  render();
}
boot();
setInterval(function(){if(!$('sheets').children.length)closingTick();if(state.view==='home'&&!$('sheets').children.length){var c=document.querySelector('.clock');if(c){var n=new Date(),h=n.getHours();c.innerHTML=(h%12||12)+':'+pad(n.getMinutes())+' <span>'+(h<12?'ص':'م')+'</span>'}}},30000);
window.EMDRebuild={db:function(){return db},index:index,total:total,payState:payState,status:status};

})();
